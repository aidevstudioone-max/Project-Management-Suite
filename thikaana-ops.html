<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ठिkaana Ops</title>
<link rel="icon" href="thikaana-logo.png">
<script>
/* Brand mark loader: try a few extensions, then fall back to the ठ glyph.
   Defined before <body> so the static <img onerror> handlers can use it. */
window.__logoFallback = function(img){
  var left = (img.getAttribute("data-try") || "svg,jpg,jpeg,webp,png").split(",").filter(Boolean);
  if(left.length){
    var ext = left.shift();
    img.setAttribute("data-try", left.join(","));
    img.src = "thikaana-logo." + ext;
  } else {
    var span = img.parentNode; if(span){ span.textContent = "ठ"; }
  }
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Karla:wght@400;600&family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Mukta:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600&family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#f5f6fa; --card:#ffffff; --border:#e5e7f0; --text:#181a2e; --muted:#686d84;
    --sidebar:#121324; --sidebar-text:#b4b8d1; --sidebar-active:#23253f;
    --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef0fe;
    --danger:#dc2626; --danger-soft:#fdecec; --success:#16a34a; --success-soft:#e8f8ee;
    --warn:#b45309; --warn-soft:#fdf1de;
    --radius:12px;
    --shadow-sm:0 1px 2px rgba(15,15,40,.05), 0 1px 1px rgba(15,15,40,.04);
    --shadow-md:0 8px 24px rgba(15,15,40,.08), 0 2px 6px rgba(15,15,40,.05);
    --shadow-lg:0 24px 60px rgba(15,15,40,.16);
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  #demo-banner{background:#1d2030;color:#fff;font-size:12.5px;padding:7px 16px;text-align:center;}
  #demo-banner b{color:#ffcf70;}

  #login-screen{min-height:calc(100vh - 34px);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#171a2b,#2a2f6a);padding:16px;}
  .login-box{background:var(--card);padding:40px 36px;border-radius:16px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center;}
  .logo-badge{width:56px;height:56px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;margin:0 auto 14px;}
  .login-box h1{font-size:20px;margin:0 0 4px;}
  .login-box p.sub{color:var(--muted);font-size:13px;margin:0 0 22px;}
  .login-box input{width:100%;padding:11px 12px;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;}
  .login-box button{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;margin-top:6px;}
  .login-box button:hover{background:var(--accent-hover);}
  #login-error{color:var(--danger);font-size:12.5px;min-height:18px;margin-top:2px;}
  .demo-hint{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:9px 12px;font-size:11.5px;margin-top:10px;text-align:left;line-height:1.6;max-height:150px;overflow-y:auto;}
  .demo-hint b{display:block;margin:6px 0 2px;}
  .demo-hint b:first-child{margin-top:0;}

  #app{display:none;min-height:100vh;}
  .shell{display:flex;min-height:calc(100vh - 34px);}
  .sidebar{width:226px;background:var(--sidebar);color:var(--sidebar-text);flex-shrink:0;display:flex;flex-direction:column;padding:18px 13px;box-shadow:2px 0 12px rgba(0,0,0,.15);position:relative;z-index:2;}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
  .sidebar .brand .logo-badge{width:34px;height:34px;font-size:16px;border-radius:10px;margin:0;box-shadow:0 4px 10px rgba(79,70,229,.4);}
  .sidebar .brand b{color:#fff;font-size:15px;letter-spacing:-.01em;}
  .sidebar .brand span{display:block;font-size:10.5px;color:#8286a3;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--sidebar-text);font-size:13.3px;font-weight:500;cursor:pointer;margin-bottom:2px;user-select:none;text-decoration:none;transition:background .12s ease,color .12s ease;}
  .nav-item:hover{background:#1d1f38;color:#fff;}
  .nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
  .nav-item .ic{width:18px;text-align:center;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;}
  .nav-item .ic svg{width:16px;height:16px;}
  .nav-item .count{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px;}
  .nav-sub{padding-left:26px;}
  .nav-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#5c6084;padding:16px 12px 5px;}

  .acting-as{background:#1a1c33;border-radius:9px;padding:9px 10px;margin-bottom:10px;border:1px solid #262a44;}
  .acting-as label{display:block;font-size:10px;color:#8286a3;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  .acting-as select{width:100%;background:#0f1122;color:#fff;border:1px solid #33375a;border-radius:7px;padding:6px 7px;font-size:12.5px;}

  .sidebar-org{background:#1a1c33;border-radius:9px;padding:10px 11px;margin-bottom:10px;font-size:12px;border:1px solid #262a44;}
  .sidebar-org b{display:block;color:#fff;font-size:13px;}

  .sidebar-footer{margin-top:14px;padding-top:10px;border-top:1px solid #262a44;}
  .sidebar-footer button{width:100%;padding:9px;background:#1e2038;color:#fff;border:1px solid #2c2f4d;border-radius:8px;font-size:12.5px;font-weight:500;transition:background .12s ease;}
  .sidebar-footer button:hover{background:#282b48;}

  /* Sample (dummy) data cues */
  tr.dummy-row > td{background:#fff1f1;}
  .card.dummy-card{background:#fff5f5;border-color:#f3cccc;}
  .sample-pill{display:inline-block;background:#fde3e3;color:#b3261e;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 7px;border-radius:20px;vertical-align:middle;}
  .sample-note{display:flex;align-items:center;gap:8px;background:#fff5f5;border:1px solid #f3cccc;color:#a5342b;font-size:12.5px;border-radius:10px;padding:8px 12px;margin-bottom:14px;}
  .sample-note .sample-pill{flex-shrink:0;}

  /* Footfall analytics */
  .ff-range{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .ff-range button{padding:6px 12px;border:1px solid var(--border);background:var(--card);border-radius:8px;font-size:12.5px;color:var(--muted);}
  .ff-range button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .ff-chart{width:100%;height:180px;display:block;overflow:visible;}
  .ff-bar:hover{filter:brightness(1.08);}
  .ff-axis{fill:var(--muted);font-size:10px;}
  .ff-live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);margin-right:6px;animation:ffpulse 1.8s ease-in-out infinite;}
  @keyframes ffpulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .ff-snippet{background:#0f1122;color:#d8dcff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:12px 14px;border-radius:10px;overflow-x:auto;white-space:pre;}

  .main{flex:1;padding:28px 34px;overflow-y:auto;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
  .topbar h2{margin:0 0 3px;font-size:21px;font-weight:700;letter-spacing:-.01em;}
  .topbar p{margin:0;color:var(--muted);font-size:13px;}
  .btn{padding:9px 16px;border-radius:9px;border:none;font-size:13.5px;font-weight:600;background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(79,70,229,.15), 0 2px 8px rgba(79,70,229,.18);transition:background .12s ease,box-shadow .12s ease,transform .12s ease;}
  .btn:hover{background:var(--accent-hover);box-shadow:0 2px 4px rgba(79,70,229,.2), 0 4px 14px rgba(79,70,229,.25);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow-sm);}
  .btn.secondary:hover{background:#f7f8fb;border-color:#d3d6e3;}
  .btn.danger{background:var(--danger-soft);color:var(--danger);box-shadow:none;}
  .btn.small{padding:6px 11px;font-size:12px;border-radius:7px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);transition:box-shadow .15s ease,transform .15s ease;}
  .stat-card.clickable{cursor:pointer;}
  .stat-card.clickable:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .stat-card .label{font-size:11.5px;color:var(--muted);margin-bottom:7px;font-weight:500;}
  .stat-card .value{font-size:22px;font-weight:800;letter-spacing:-.01em;}
  .stat-card .value.small{font-size:16px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
  .card h3{margin:0 0 14px;font-size:14.5px;font-weight:700;letter-spacing:-.005em;}
  .two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  @media (max-width:900px){ .two-col{grid-template-columns:1fr;} }

  .toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap;}
  .toolbar input[type=text],.toolbar input[type=search],.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;}
  .toolbar .grow{flex:1;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--border);background:#fafaff;}
  td{padding:11px 10px;border-bottom:1px solid #f0f1f6;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr.clickable{transition:background .1s ease;}
  tr.clickable:hover{background:#f8f9fc;cursor:pointer;}
  .empty-row{text-align:center;color:var(--muted);padding:30px !important;}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .pill.gray{background:#eef0f5;color:#555a72;}
  .pill.green{background:var(--success-soft);color:var(--success);}
  .pill.red{background:var(--danger-soft);color:var(--danger);}
  .pill.blue{background:var(--accent-soft);color:var(--accent);}
  .pill.yellow{background:#fef6e0;color:#a5720b;}
  .pill.orange{background:var(--warn-soft);color:var(--warn);}
  .mono{font-family:ui-monospace,Consolas,monospace;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{border:1px solid var(--border);background:#fff;border-radius:7px;padding:5px 8px;font-size:12px;transition:background .12s ease,border-color .12s ease;}
  .icon-btn:hover{background:#f0f1f6;}
  .pw-cell{display:flex;align-items:center;gap:6px;}

  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .team-card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);}
  .team-card .avatar{width:44px;height:44px;font-size:16px;}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;}

  .comment{display:flex;gap:10px;margin-bottom:14px;}
  .comment .avatar{width:28px;height:28px;font-size:11px;}
  .comment .bubble{background:#f5f6fa;border-radius:10px;padding:9px 12px;flex:1;}
  .comment.mine .bubble{background:var(--accent-soft);}
  .comment .meta{font-size:11.5px;color:var(--muted);margin-bottom:3px;}
  .comment .meta b{color:var(--text);}
  .comment .text{font-size:13px;line-height:1.5;white-space:pre-wrap;}

  .history-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f0f1f5;font-size:12.5px;}
  .history-item:last-child{border-bottom:none;}
  .history-item .time{color:var(--muted);white-space:nowrap;min-width:120px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;}
  .tab-btn{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab-btn:hover{color:var(--text);}

  .priority-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px;}
  .priority-card{border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;border:1px solid transparent;}
  .priority-card .num{font-size:26px;font-weight:800;}
  .priority-card .lbl{font-size:12px;font-weight:600;margin-top:2px;}
  .priority-card:hover{border-color:currentColor;}
  .priority-card.Urgent{background:var(--danger-soft);color:var(--danger);}
  .priority-card.High{background:var(--warn-soft);color:var(--warn);}
  .priority-card.Medium{background:var(--accent-soft);color:var(--accent);}
  .priority-card.Low{background:#eef0f5;color:#555a72;}
  .priority-card.active{outline:2px solid currentColor;}

  .overlay{position:fixed;inset:0;background:rgba(15,17,32,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:26px 28px;box-shadow:var(--shadow-lg);}
  .modal.wide{max-width:720px;}
  .modal h3{margin:0 0 16px;font-size:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:#464a5c;margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .checkbox-group{display:flex;flex-wrap:wrap;gap:10px;}
  .checkbox-group label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:7px;}
  .wm-shell{display:flex;align-items:stretch;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden;}
  .wm-nav{width:232px;flex-shrink:0;position:sticky;top:0;align-self:flex-start;background:#f5f6fb;border-right:1px solid var(--border);padding:18px 12px;}
  .wm-nav-group{margin-bottom:4px;}
  .wm-nav-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 10px;margin:16px 0 6px;}
  .wm-nav-label:first-child{margin-top:0;}
  .wm-nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text);text-decoration:none;cursor:pointer;margin-bottom:2px;transition:background .12s ease,color .12s ease,transform .12s ease;}
  .wm-nav-item:hover{background:#e8eaf5;color:var(--accent);transform:translateX(1px);}
  .wm-nav-item.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.3);}
  .wm-nav-item.active:hover{background:var(--accent-hover);color:#fff;transform:none;}
  .wm-nav-item .ic{width:18px;text-align:center;font-size:14px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;}
  .wm-nav-item .ic svg{width:16px;height:16px;}
  .wm-nav-item .sub{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:1px;}
  .wm-nav-item.active .sub{color:#fff;opacity:.75;}
  .wm-content{flex:1;min-width:0;background:#fff;padding:26px 30px;}

  /* Dark mode — scoped entirely to .wm-shell.wm-dark. Redefines the same design
     tokens (--card,--border,--text,--muted,etc.) used everywhere else in Manage
     Website, so every existing rule and inline style picks up dark values
     automatically inside this panel — nothing outside it is touched. */
  .wm-shell.wm-dark{
    --card:#1f2130; --border:rgba(255,255,255,.11); --text:#eef0fb; --muted:#9498b0;
    --accent-soft:rgba(124,117,255,.20);
    --success-soft:rgba(22,163,74,.22); --danger-soft:rgba(220,38,38,.22); --warn-soft:rgba(217,138,15,.24);
    background:#15161f; border-color:rgba(255,255,255,.10);
  }
  .wm-shell.wm-dark .wm-nav{background:#101018;border-right-color:rgba(255,255,255,.10);}
  .wm-shell.wm-dark .wm-content{background:#181a26;color:var(--text);}
  .wm-shell.wm-dark .wm-nav-label{color:#6e7290;}
  .wm-shell.wm-dark .wm-nav-item{color:#e2e4f6;}
  .wm-shell.wm-dark .wm-nav-item:hover{background:#242640;color:#b6b0ff;}
  .wm-shell.wm-dark .wm-nav-item.active{background:var(--accent);color:#fff;}
  .wm-shell.wm-dark .wm-section-head h3{color:var(--text);}
  .wm-shell.wm-dark .wm-section-head p{color:var(--muted);}
  .wm-shell.wm-dark table th{background:#14151f;color:var(--muted);border-bottom-color:var(--border);}
  .wm-shell.wm-dark table td{border-bottom-color:rgba(255,255,255,.07);color:var(--text);}
  .wm-shell.wm-dark tr.clickable:hover{background:#20223a;}
  .wm-shell.wm-dark .card{box-shadow:none;}
  .wm-shell.wm-dark .card h3{color:var(--text);}
  .wm-shell.wm-dark .field label{color:#c7cae2;}
  .wm-shell.wm-dark .field input,.wm-shell.wm-dark .field select,.wm-shell.wm-dark .field textarea{background:#14151f;color:var(--text);border-color:rgba(255,255,255,.16);}
  .wm-shell.wm-dark .field input::placeholder,.wm-shell.wm-dark .field textarea::placeholder{color:#565a75;}
  .wm-shell.wm-dark .btn.secondary{background:#262840;border-color:rgba(255,255,255,.16);color:var(--text);}
  .wm-shell.wm-dark .btn.secondary:hover{background:#30324f;}
  .wm-shell.wm-dark .icon-btn{background:#262840;border-color:rgba(255,255,255,.16);color:var(--text);}
  .wm-shell.wm-dark .icon-btn:hover{background:#30324f;}
  .wm-shell.wm-dark .wm-photo-thumb{background:#242640;color:var(--muted);}
  .wm-shell.wm-dark .empty-row{color:var(--muted);}
  .wm-shell.wm-dark .wm-counter{color:#7a7ea0;}
  .wm-shell.wm-dark .checkbox-group label{background:#20223a;border-color:rgba(255,255,255,.16);color:var(--text);}
  .wm-shell.wm-dark .mono{color:var(--text);}
  .wm-shell.wm-dark .wm-banner-preview.off{background:#20223a;color:var(--muted);}
  .wm-shell.wm-dark .pill.gray{background:#2a2c46;color:#c7cae2;}
  .wm-section-head{margin-bottom:18px;}
  .wm-section-head h3{margin:0 0 4px;font-size:17px;}
  .wm-section-head p{margin:0;color:var(--muted);font-size:13px;}
  .wm-photo-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;position:relative;}
  .wm-photo-thumb{width:100%;height:130px;border-radius:8px;background:#eef0f5;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;margin-bottom:8px;text-align:center;}
  .wm-select{position:absolute;top:10px;right:10px;}
  .wm-save-msg{font-size:12px;color:var(--success);margin-top:8px;min-height:16px;}
  .wm-hint{font-size:12px;color:var(--muted);margin:-4px 0 14px;line-height:1.6;}
  .wm-field-error{font-size:11.5px;color:var(--danger);margin-top:-8px;margin-bottom:12px;min-height:14px;}
  .wm-field-error:empty{display:none;}
  .field.has-error input,.field.has-error textarea,.field.has-error select{border-color:var(--danger);background:var(--danger-soft);}
  .wm-counter{font-size:11px;color:var(--muted);text-align:right;margin-top:-8px;margin-bottom:10px;}
  .wm-counter.over{color:var(--danger);font-weight:600;}
  .wm-toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .wm-toast{background:var(--dark);color:#fff;padding:12px 16px;border-radius:9px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:340px;display:flex;align-items:center;gap:10px;animation:wmToastIn .2s ease;}
  .wm-toast.error{background:var(--danger);}
  @keyframes wmToastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .wm-section-toggle-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:6px;}
  .wm-section-toggle{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:12.5px;}
  .wm-section-toggle b{display:block;font-size:12.5px;}
  .wm-section-toggle span{display:block;color:var(--muted);font-size:11px;margin-top:1px;line-height:1.4;}
  .wm-banner-preview{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;}
  .wm-banner-preview.off{background:#eef0f5;color:var(--muted);}
  .wm-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:6px;position:relative;top:-1px;}
  .wm-pending-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--warn-soft);border:1px solid #f0dca8;color:#8a5c00;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:18px;flex-wrap:wrap;}
  .wm-preview-section{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
  .wm-preview-section-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f7f8fc;border-bottom:1px solid var(--border);}
  .wm-preview-section-head b{font-size:13.5px;}
  .wm-preview-body{padding:14px 16px;font-size:13px;line-height:1.7;}
  .wm-preview-body table{width:100%;}
  .wm-changed-badge{background:var(--warn-soft);color:#8a5c00;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .wm-site-preview{
    --site-bg:#f7f8fc; --site-surface:#fff; --site-surface2:#eef0f5; --site-ink:#1d2030; --site-muted:#6b7080;
    --site-accent:#4f46e5; --site-accent-ink:#fff; --site-border:#e3e5ec; --site-radius:14px;
    --site-font-display:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; --site-font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--site-surface);color:var(--site-ink);border-radius:var(--site-radius);border:1px solid var(--site-border);overflow:hidden;font-family:var(--site-font-body);box-shadow:0 10px 30px rgba(20,20,30,.08);
  }
  .wm-site-brand-tag{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:11px;background:var(--site-bg);color:var(--site-muted);border-bottom:1px solid var(--site-border);}
  .wm-site-brand-dot{width:8px;height:8px;border-radius:50%;background:var(--site-accent);flex-shrink:0;}
  .wm-site-banner{background:var(--site-accent);color:var(--site-accent-ink);padding:10px 16px;text-align:center;font-size:13px;font-weight:600;}
  .wm-site-hero{background:var(--site-bg);color:var(--site-ink);padding:48px 32px;text-align:center;}
  .wm-site-hero h1{margin:0 0 10px;font-size:28px;font-family:var(--site-font-display);font-weight:700;color:var(--site-ink);}
  .wm-site-hero p{margin:0 auto;font-size:14px;color:var(--site-muted);max-width:520px;line-height:1.6;}
  .wm-site-section{padding:26px 32px;border-top:1px solid var(--site-border);background:var(--site-surface);}
  .wm-site-section.updated{box-shadow:inset 3px 0 0 var(--warn), inset 0 0 0 1000px rgba(255,180,60,.09);}
  .wm-site-section h2{font-size:17px;margin:0 0 14px;font-family:var(--site-font-display);font-weight:700;color:var(--site-ink);display:flex;align-items:center;gap:8px;}
  .wm-site-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;}
  .wm-site-photo{aspect-ratio:1;border-radius:calc(var(--site-radius) - 6px);background:var(--site-surface2);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--site-muted);text-align:center;padding:4px;}
  .wm-site-menu-cat{margin-bottom:16px;}
  .wm-site-menu-cat h4{font-size:13.5px;margin:0 0 8px;font-family:var(--site-font-display);font-weight:600;color:var(--site-accent);}
  .wm-site-menu-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--site-border);font-size:13px;color:var(--site-ink);}
  .wm-site-offer-card,.wm-site-testimonial{background:var(--site-surface2);border-radius:calc(var(--site-radius) - 4px);padding:14px 16px;margin-bottom:10px;font-size:13px;color:var(--site-ink);}
  .wm-site-faq{margin-bottom:12px;}
  .wm-site-faq b{display:block;font-size:13.5px;margin-bottom:3px;color:var(--site-ink);}
  .wm-site-faq span{color:var(--site-muted);}
  .wm-site-hours-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--site-border);color:var(--site-ink);}
  .wm-site-footer{background:var(--site-ink);color:var(--site-surface);padding:22px 32px;text-align:center;font-size:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .action-item-row{display:flex;gap:6px;margin-bottom:8px;align-items:center;}
  .action-item-row input[type=text]{flex:2;}
  .action-item-row input[type=date]{flex:1.2;}
  .action-item-row select{flex:1;}
  .action-item-row .icon-btn{flex:0;}
  .priority-choice{display:flex;gap:8px;}
  .priority-choice label{flex:1;text-align:center;padding:9px 4px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);}
  .priority-choice input{display:none;}
  .priority-choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .perm-list{display:flex;flex-direction:column;gap:6px;}
  .perm-list label{display:flex;align-items:center;gap:8px;font-size:13px;}

  .back-link{font-size:12.5px;color:var(--accent);cursor:pointer;margin-bottom:10px;display:inline-block;}
  .profile-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .profile-stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px;}
  .profile-stats div{font-size:12.5px;color:var(--muted);}
  .profile-stats b{display:block;color:var(--text);font-size:17px;font-weight:700;}
  .status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--success);margin-right:6px;}

  ::placeholder{color:#a7abbd;}

  /* ---- v2 additions: presence, status boxes, clickable stats, animations ---- */
  .presence-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;position:relative;top:-1px;}
  .presence-dot.glow{animation:presencePulse 2s infinite;}
  @keyframes presencePulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.55);}70%{box-shadow:0 0 0 7px rgba(22,163,74,0);}100%{box-shadow:0 0 0 0 rgba(22,163,74,0);}}
  .presence-select{background:#171a2b;color:#fff;border:1px solid #33375a;border-radius:6px;padding:5px 6px;font-size:11.5px;width:100%;}

  .status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
  .status-box{border-radius:var(--radius);padding:14px;text-align:center;border:1.5px solid transparent;transition:transform .15s ease,box-shadow .15s ease;}
  .status-box .num{font-size:22px;font-weight:800;}
  .status-box .lbl{font-size:11px;font-weight:600;margin-top:2px;}

  .stat-card{transition:transform .15s ease,box-shadow .15s ease;}
  .stat-card.clickable:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(24,30,60,.08);}
  .card{transition:box-shadow .15s ease;}
  .priority-card{transition:transform .15s ease;}
  .priority-card:hover{transform:translateY(-2px);}

  .stat-card.accent{border-top:3px solid var(--accent);}
  .stat-card.accent-danger{border-top:3px solid var(--danger);}
  .stat-card.accent-success{border-top:3px solid var(--success);}
  .stat-card.accent-warn{border-top:3px solid var(--warn);}
  .stat-card.accent-gray{border-top:3px solid #9aa0b4;}

  #impersonation-banner{display:none;background:#3d2c00;color:#ffcf70;font-size:12.5px;padding:8px 16px;text-align:center;}
  #package-landing{display:none;background:var(--bg);min-height:100vh;}
  .other-pkg-card{cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;}
  .other-pkg-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(24,30,60,.08);border-color:var(--accent);}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .fade-in{animation:fadeInUp .35s ease-out both;}
  .fade-in-stagger{animation:fadeInUp .4s ease-out both;}
  @keyframes modalPop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  .modal-pop{animation:modalPop .22s ease-out both;}
  @media (prefers-reduced-motion: reduce){ .fade-in,.fade-in-stagger,.modal-pop{animation:none;} }

  /* ============================================================
     BRAND LOGO — <img> inside .logo-badge, falls back to the ठ glyph
     ============================================================ */
  .logo-badge{overflow:hidden;padding:0;}
  /* the supplied mark has a wide margin + a faint sparkle ring; scale up a touch so the
     glyph fills the badge and the dead border / ring get clipped by overflow:hidden. */
  .logo-badge .brand-logo{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;transform:scale(1.34);}

  /* ============================================================
     LOGIN — show/hide password
     ============================================================ */
  .pw-wrap{position:relative;margin-bottom:12px;}
  .pw-wrap input{margin-bottom:0 !important;padding-right:44px !important;}
  .login-box button.pw-eye{position:absolute;top:50%;right:5px;transform:translateY(-50%);
    width:34px;height:34px;min-width:0;margin:0;
    display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;
    color:var(--muted);border-radius:8px;box-shadow:none;
    transition:color .15s ease,background .15s ease;}
  .login-box button.pw-eye:hover{color:var(--accent);background:var(--accent-soft);transform:translateY(-50%);box-shadow:none;filter:none;}
  .login-box button.pw-eye:active{transform:translateY(-50%) scale(1);}
  .login-box button.pw-eye::after{display:none;}
  .login-box button.pw-eye svg{width:19px;height:19px;pointer-events:none;}

  /* ============================================================
     LIQUID BUTTONS — glossy gradient fill + a shine sweep on hover.
     Applies to the primary .btn and the login button. Secondary /
     danger / icon buttons are left flat on purpose.
     ============================================================ */
  .btn:not(.secondary):not(.danger),
  .login-box button{
    position:relative;overflow:hidden;isolation:isolate;
    background:linear-gradient(135deg,#6d67f0 0%,#4f46e5 55%,#4338ca 100%);
    box-shadow:0 1px 2px rgba(79,70,229,.25), 0 6px 18px rgba(79,70,229,.28), inset 0 1px 0 rgba(255,255,255,.22);
    transition:transform .18s cubic-bezier(.2,.8,.25,1), box-shadow .18s ease, filter .18s ease;
  }
  .btn:not(.secondary):not(.danger)::after,
  .login-box button::after{
    content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
    background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.45) 46%,rgba(255,255,255,.05) 60%,transparent 72%);
    transform:translateX(-130%);transition:transform .6s cubic-bezier(.22,.61,.36,1);
  }
  .btn:not(.secondary):not(.danger):hover,
  .login-box button:hover{
    transform:translateY(-2px);filter:saturate(1.08);
    box-shadow:0 2px 6px rgba(79,70,229,.3), 0 14px 32px rgba(79,70,229,.4), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .btn:not(.secondary):not(.danger):hover::after,
  .login-box button:hover::after{transform:translateX(130%);}
  .btn:not(.secondary):not(.danger):active,
  .login-box button:active{transform:translateY(0) scale(.985);}

  /* soft "liquid" hover for nav + cards */
  .nav-item{position:relative;overflow:hidden;}
  .nav-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 3px 3px 0;
    background:linear-gradient(180deg,#8b85ff,#4f46e5);transform:scaleY(0);transition:transform .18s ease;transform-origin:center;}
  .nav-item:hover::before,.nav-item.active::before{transform:scaleY(.62);}
  .stat-card,.card,.team-card,.priority-card,.other-pkg-card{transition:transform .18s cubic-bezier(.2,.8,.25,1),box-shadow .18s ease,border-color .18s ease;}
  .wm-nav-item,.icon-btn,.btn.secondary,.ff-range button{transition:transform .15s ease,background .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease;}
  .btn.secondary:hover,.ff-range button:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}

  @media (prefers-reduced-motion: reduce){
    .btn::after,.login-box button::after{display:none;}
    .btn,.login-box button,.nav-item::before,.stat-card,.card,.team-card,.priority-card{transition:none;}
  }

  /* ============================================================
     EXPENSES — settlement / "who owes whom" panel
     ============================================================ */
  .settle-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px;}
  .settle-person{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm);}
  .settle-person .nm{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .settle-person .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 0;}
  .settle-person .net{margin-top:7px;padding-top:7px;border-top:1px solid var(--border);font-size:13px;font-weight:700;display:flex;justify-content:space-between;}
  .settle-person .net.pos{color:var(--success);}
  .settle-person .net.neg{color:var(--danger);}
  .settle-person .net.zero{color:var(--muted);}
  .settle-tx{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;font-size:13px;background:var(--card);}
  .settle-tx .who{font-weight:700;}
  .settle-tx .arrow{color:var(--accent);flex-shrink:0;}
  .settle-tx .amt{margin-left:auto;font-weight:800;}
  .settle-tx.done{opacity:.55;}
  .settle-empty{font-size:13px;color:var(--muted);padding:6px 0;}
  .split-tag{display:inline-block;font-size:11px;color:var(--muted);margin-top:2px;}
  .split-picker{display:flex;flex-wrap:wrap;gap:8px;}
  .split-picker label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:8px;cursor:pointer;}
  .split-picker label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .split-picker input{accent-color:var(--accent);}

  /* ============================================================
     FOOTFALL — geo drill-down + property split
     ============================================================ */
  .ff-geo-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;}
  @media (max-width:720px){ .ff-geo-wrap, .ff-geo-wrap.with-donut{grid-template-columns:1fr;} }
  .ff-country-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;border:1px solid transparent;}
  .ff-country-row:hover{background:var(--accent-soft);}
  .ff-country-row.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700;}
  .ff-country-row .flag{margin-right:7px;}
  .ff-cc{display:inline-block;min-width:24px;text-align:center;font-size:10px;font-weight:700;
    letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);border-radius:5px;
    padding:2px 5px;margin-right:6px;font-family:ui-monospace,Consolas,monospace;vertical-align:middle;}
  .ff-prop-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .ff-prop-tabs button{padding:6px 12px;border:1px solid var(--border);background:var(--card);border-radius:8px;font-size:12.5px;color:var(--muted);}
  .ff-prop-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .ff-crossover{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .ff-crossover .box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm);text-align:center;}
  .ff-crossover .box .n{font-size:20px;font-weight:800;}
  .ff-crossover .box .l{font-size:11px;color:var(--muted);margin-top:3px;}
  .ff-geo-wrap.with-donut{grid-template-columns:180px minmax(0,1fr) minmax(0,1.1fr);}

  /* ============================================================
     CHARTS — hand-rolled animated SVG donut + trend + bar visuals,
     shared by Expenses (category split, spending trend) and
     Footfall (property split, country split, views-per-day bars).
     No charting library: everything here is inline SVG + CSS
     transitions, so it works offline and needs no CDN.
     ============================================================ */
  .donut-row{display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
  .donut-wrap{position:relative;flex-shrink:0;}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 8px;}
  .donut-center .v{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.1;}
  .donut-center .l{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .donut-empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;border:2px dashed var(--border);border-radius:50%;text-align:center;padding:10px;}
  .donut-legend{flex:1;min-width:190px;display:flex;flex-direction:column;gap:1px;}
  .donut-legend-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:12.5px;transition:background .15s ease;}
  .donut-legend-row:hover,.donut-legend-row.hl{background:var(--accent-soft);}
  .donut-legend-row .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .donut-legend-row .lbl{flex:1;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .donut-legend-row .val{font-weight:700;white-space:nowrap;}
  .donut-legend-row .pct{color:var(--muted);min-width:32px;text-align:right;font-size:11px;}
  .chart-arc{cursor:default;}
  .trend-chart{width:100%;height:150px;display:block;overflow:visible;}
  .trend-dot{fill:var(--accent);stroke:var(--card);stroke-width:2;transition:r .15s ease;}
  .trend-dot:hover{r:5.5;}
  @media (prefers-reduced-motion: reduce){
    .chart-arc,[data-grow],[data-draw],[data-fade]{transition:none !important;}
  }

  /* ============================================================
     MOBILE / RESPONSIVE — Thikaana Ops
     Desktop layout is unchanged; rules below only apply at
     narrow widths. The sidebar becomes a slide-in drawer.
     ============================================================ */
  .mobile-topbar{display:none;}
  .nav-backdrop{display:none;}

  @media (max-width:820px){
    .mobile-topbar{
      display:flex;align-items:center;gap:12px;
      background:var(--sidebar);color:#fff;
      padding:10px 14px;position:sticky;top:0;z-index:40;
      box-shadow:0 2px 10px rgba(0,0,0,.18);
    }
    .nav-toggle{
      width:38px;height:38px;flex-shrink:0;display:inline-flex;
      align-items:center;justify-content:center;
      background:#1e2038;color:#fff;border:1px solid #2c2f4d;
      border-radius:9px;font-size:16px;line-height:1;padding:0;
    }
    .mobile-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;}
    .mobile-brand .logo-badge{width:26px;height:26px;font-size:13px;border-radius:8px;margin:0;box-shadow:none;}

    .shell{display:block;min-height:0;}
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;width:264px;max-width:84vw;
      transform:translateX(-100%);transition:transform .25s ease;
      z-index:60;overflow-y:auto;padding-top:16px;
    }
    .shell.nav-open .sidebar{transform:translateX(0);}
    .shell.nav-open .nav-backdrop{
      display:block;position:fixed;inset:0;
      background:rgba(10,12,24,.5);z-index:55;
    }

    .main{padding:16px 14px;min-height:0;}
    .topbar{margin-bottom:18px;}
    .topbar h2{font-size:18px;}

    /* wide content scrolls inside itself, never the page */
    #main-content table{display:block;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}

    .field-row{flex-direction:column;gap:0;}
    .history-item{flex-direction:column;gap:2px;}
    .history-item .time{min-width:0;}
    .toolbar{gap:8px;}
    .toolbar .grow{flex-basis:100%;}

    .modal{padding:20px 18px;max-height:92vh;}
    .overlay{padding:12px;}
    .modal-actions{flex-wrap:wrap;}

/* ---------------- Data layer: in-memory cache, localStorage mirror, Supabase sync ----------------
   loadKey / saveKey stay synchronous so none of the ~100 call sites change. On boot,
   initCloud() hydrates STATE from the shared Supabase table (one round trip). Every
   saveKey updates STATE, mirrors to localStorage (offline fallback), and upserts to
   Supabase. Realtime + polling keep the 4 team members' views in sync.
   The login session (thikops_session) is deliberately NOT synced — it stays per device. */
const STATE = Object.create(null);   // key -> parsed value, the source of truth at runtime
let _sb = null;                      // Supabase client (null until configured)
let _cloudReady = false;             // true once hydrated and writes are going through
const _localWriteAt = Object.create(null);  // key -> ts of last local saveKey (write-wins grace)
const LOCAL_WRITE_GRACE_MS = 8000;   // ignore stale remote values for a key this long after we wrote it

function loadKey(k){
  if(k in STATE){ const v = STATE[k]; return (v===undefined || v===null) ? null : v; }
  try{ return JSON.parse(localStorage.getItem("thikops_"+k)) || null; }catch(e){ return null; }
}
function saveKey(k, v){
  STATE[k] = v;
  _localWriteAt[k] = Date.now();
  try{ localStorage.setItem("thikops_"+k, JSON.stringify(v)); }catch(e){}
  if(_cloudReady && _sb){
    _sb.from(SUPABASE_TABLE)
      .upsert({ key:k, value:v, updated_at:new Date().toISOString() }, { onConflict:"key" })
      .then(({ error }) => {
        if(error) console.warn("[cloud] save failed for", k, error.message);
        else _localWriteAt[k] = Math.min(_localWriteAt[k], Date.now() - LOCAL_WRITE_GRACE_MS + 1200); // committed: let remote catch up shortly
      });
  }
}

async function initCloud(){

      STATE[row.key] = row.value;
      try{ localStorage.setItem("thikops_"+row.key, JSON.stringify(row.value)); }catch(e){}
    });
    _cloudReady = true;

function _applyRemote(rows){
  let changed = false;
  const now = Date.now();
  (rows||[]).forEach(row => {
    if(!row || !row.key) return;
    // Don't let a stale remote read clobber a local write that may not have committed yet.
    if(now - (_localWriteAt[row.key] || 0) < LOCAL_WRITE_GRACE_MS) return;
    if(JSON.stringify(STATE[row.key]) !== JSON.stringify(row.value)){
      STATE[row.key] = row.value;
      try{ localStorage.setItem("thikops_"+row.key, JSON.stringify(row.value)); }catch(e){}
      changed = true;
    }
  });
  if(changed && typeof render === "function" && getSession()){ try{ render(); }catch(e){} }
}
function _subscribeCloud(){
  try{
    _sb.channel("thikops_state_changes")
      .on("postgres_changes", { event:"*", schema:"public", table:SUPABASE_TABLE },
          payload => _applyRemote([payload.new]))
      .subscribe();
  }catch(e){ console.warn("[cloud] realtime unavailable, polling only", e.message||e); }
  setInterval(refreshFromCloud, 20000);
  window.addEventListener("focus", refreshFromCloud);
}
async function refreshFromCloud(){
  if(!_cloudReady || !_sb) return;

  }catch(e){}
}

/* ================= CHART HELPERS ================= *
 * Hand-rolled animated SVG — no charting library. Donuts and the trend line
 * reveal via CSS-transitioned stroke-dashoffset (a single scalar, which tweens
 * reliably in every browser incl. Safari — unlike transitioning stroke-dasharray
 * itself, or raw SVG x/y/width/height, both of which are inconsistent there).
 * Bars grow via `transform:scaleY()` with `transform-box:fill-box`, same reason.
 * animateCharts() flips every chart from its hidden start state to drawn; call
 * it once right after the HTML containing charts is inserted into the page. */
const CHART_PALETTE = ["#6d67f0","#22c55e","#f59e0b","#ef4444","#06b6d4","#a855f7","#ec4899","#84cc16"];
function chartColor(i){ return CHART_PALETTE[i % CHART_PALETTE.length]; }
function hashColor(str){ let h=0; for(let i=0;i<String(str).length;i++){ h=(h*31+String(str).charCodeAt(i))|0; } return chartColor(Math.abs(h)); }
function lightenHex(hex, amt){
  const n = parseInt(String(hex).replace("#",""),16) || 0;
  const mix = (v)=> Math.min(255, Math.round(v + (255-v)*amt));
  const r=mix((n>>16)&255), g=mix((n>>8)&255), b=mix(n&255);
  return "#" + [r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}
let _chartDefId = 0;

/* data: [{label, value, color?}]. opts: {size, stroke, fmt(v), centerValue, centerLabel, highlight(label)->bool} */
function donutChart(data, opts){
  opts = opts || {};
  const size = opts.size || 176, stroke = opts.stroke || 26;
  const r = (size - stroke) / 2, cx = size/2, cy = size/2, c = 2*Math.PI*r;
  const shown = (data||[]).filter(d=> (Number(d.value)||0) > 0);
  if(!shown.length) return `<div class="donut-empty" style="width:${size}px;height:${size}px;">No data yet</div>`;
  const total = shown.reduce((s,d)=>s+Number(d.value), 0) || 1;
  const defId = "dg"+(_chartDefId++);
  let acc = 0, arcs = "", defs = "";
  shown.forEach((d,i)=>{
    const val = Number(d.value)||0, frac = val/total;
    const seg = frac*c, gap = c-seg;
    const rotate = (acc/total)*360 - 90; acc += val;
    const color = d.color || chartColor(i);
    const gid = `${defId}-${i}`;
    const isHi = opts.highlight ? !!opts.highlight(d.label) : false;
    defs += `<linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${lightenHex(color,.28)}"/><stop offset="100%" stop-color="${color}"/></linearGradient>`;
    arcs += `<circle class="chart-arc" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#${gid})"
      stroke-width="${isHi?stroke+4:stroke}" stroke-linecap="round"
      stroke-dasharray="${seg.toFixed(2)} ${gap.toFixed(2)}"
      style="stroke-dashoffset:${seg.toFixed(2)};transform:rotate(${rotate.toFixed(2)}deg);transform-origin:${cx}px ${cy}px;transition:stroke-dashoffset .9s cubic-bezier(.16,1,.3,1) ${(i*0.08).toFixed(2)}s, stroke-width .2s ease;${isHi?"filter:drop-shadow(0 0 5px rgba(0,0,0,.3));":""}"
      data-donut-target="1"><title>${escapeHtml(d.label)}: ${escapeHtml(opts.fmt?opts.fmt(val):String(val))} (${(frac*100).toFixed(1)}%)</title></circle>`;
  });
  const center = opts.centerValue!=null ? `<div class="donut-center"><div class="v">${escapeHtml(String(opts.centerValue))}</div>${opts.centerLabel?`<div class="l">${escapeHtml(opts.centerLabel)}</div>`:""}</div>` : "";
  return `<div class="donut-wrap" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="filter:drop-shadow(0 10px 18px rgba(24,26,46,.14));overflow:visible;">
      <defs>${defs}</defs>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#00000012" stroke-width="${stroke}"/>
      ${arcs}
    </svg>
    ${center}
  </div>`;
}
function donutLegend(data, opts){
  opts = opts || {};
  const shown = (data||[]).filter(d=> (Number(d.value)||0) > 0);
  const total = shown.reduce((s,d)=>s+Number(d.value),0) || 1;
  return `<div class="donut-legend">${shown.map((d,i)=>`
    <div class="donut-legend-row" data-idx="${i}" onmouseenter="_donutHi(this,true)" onmouseleave="_donutHi(this,false)">
      <span class="sw" style="background:${d.color||chartColor(i)};"></span>
      <span class="lbl">${escapeHtml(d.label)}</span>
      <span class="val">${escapeHtml(opts.fmt?opts.fmt(d.value):String(d.value))}</span>
      <span class="pct">${((Number(d.value)/total)*100).toFixed(0)}%</span>
    </div>`).join("")}</div>`;
}
function _donutHi(el, on){
  const row = el.closest(".donut-legend-row"); if(!row) return;
  row.classList.toggle("hl", on);
  const donutRow = row.closest(".donut-row");
  const svg = donutRow ? donutRow.querySelector(".donut-wrap svg") : null;
  if(!svg) return;
  const arc = svg.querySelectorAll(".chart-arc")[+row.dataset.idx];
  if(arc) arc.style.filter = on ? "brightness(1.12) drop-shadow(0 0 6px rgba(0,0,0,.32))" : "";
}
/* points: [{label, value}] in chronological order. opts:{width,height,fmt} */
function lineAreaChart(points, opts){
  opts = opts || {};
  const W = opts.width || 640, H = opts.height || 150, padX = 10, padT = 16, padB = 22;
  const n = points.length || 1;
  const max = Math.max(1, ...points.map(p=>Number(p.value)||0));
  const stepX = n>1 ? (W-padX*2)/(n-1) : 0;
  const yFor = v => padT + (H-padT-padB) * (1 - (v/max));
  const coords = points.map((p,i)=>[padX+i*stepX, yFor(Number(p.value)||0)]);
  const linePath = coords.map((pt,i)=>(i?"L":"M")+pt[0].toFixed(1)+" "+pt[1].toFixed(1)).join(" ");
  const areaPath = coords.length ? `M${coords[0][0].toFixed(1)} ${(H-padB).toFixed(1)} ` +
    coords.map(pt=>`L${pt[0].toFixed(1)} ${pt[1].toFixed(1)}`).join(" ") +
    ` L${coords[coords.length-1][0].toFixed(1)} ${(H-padB).toFixed(1)} Z` : "";
  const dots = coords.map((pt,i)=>`<circle class="trend-dot" cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="3.5"><title>${escapeHtml(points[i].label)}: ${escapeHtml(opts.fmt?opts.fmt(points[i].value):String(points[i].value))}</title></circle>`).join("");
  const labels = coords.map((pt,i)=> (i===0||i===n-1||i===Math.floor((n-1)/2)) ? `<text class="ff-axis" x="${pt[0].toFixed(1)}" y="${H-4}" text-anchor="middle">${escapeHtml(points[i].label)}</text>` : "").join("");
  const gid = "tg"+(_chartDefId++);
  return `<svg class="trend-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".32"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#${gid})" style="opacity:0;transition:opacity 1s ease .35s;" data-fade="1"></path>
    <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
      pathLength="1000" stroke-dasharray="1000" style="stroke-dashoffset:1000;transition:stroke-dashoffset 1.15s cubic-bezier(.16,1,.3,1);" data-draw="1"></path>
    ${dots}${labels}
  </svg>`;
}
/* Group items by calendar month, oldest -> newest, for the last `n` months. */
function monthBuckets(items, n, dateKey, valueFn){
  const out = []; const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push({ key: d.toISOString().slice(0,7), label: d.toLocaleDateString("en-IN",{month:"short"}), value:0 });
  }
  const idx = {}; out.forEach((b,i)=>idx[b.key]=i);
  (items||[]).forEach(it=>{
    const k = String(dateKey(it)||"").slice(0,7);
    if(k in idx) out[idx[k]].value += valueFn(it);
  });
  return out;
}
/* Flip every chart in `root` from its hidden starting state to drawn. */
function animateCharts(root){
  root = root || document;
  const reveal = ()=>{
    root.querySelectorAll('[data-donut-target],[data-draw]').forEach(el=>{ el.style.strokeDashoffset = "0"; });
    root.querySelectorAll('[data-grow]').forEach(el=>{ el.style.transform = "scaleY(1)"; });
    root.querySelectorAll('[data-fade]').forEach(el=>{ el.style.opacity = "1"; });
  };
  if(prefersReducedMotion()){ reveal(); return; }
  requestAnimationFrame(()=>requestAnimationFrame(reveal));
}
/* Animate a stat-card number counting up to its final value. */
function countUp(el, target, opts){
  opts = opts || {};
  target = Number(target)||0;
  if(!el) return;
  if(prefersReducedMotion()){ el.textContent = opts.fmt ? opts.fmt(target) : Math.round(target).toLocaleString("en-IN"); return; }
  const dur = opts.duration || 750, start = performance.now();
  function tick(now){
    const t = Math.min(1, (now-start)/dur);
    const eased = 1 - Math.pow(1-t, 3);
    const val = target*eased;
    el.textContent = opts.fmt ? opts.fmt(val) : Math.round(val).toLocaleString("en-IN");
    if(t<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function attemptLogin(){
  const email = document.getElementById("login-email").value.trim().toLowerCase();
  const pass = document.getElementById("login-pass").value;
  if(email === SHARED_LOGIN.email && pass === SHARED_LOGIN.password){
    setSession({ type:"employee", actingAs: "ankit" });
    showApp(); return;
  }
  const user = (loadKey("clientUsers")||[]).find(u=>u.email.toLowerCase()===email);
  if(user && pass === DEMO_PASSWORD){
    if(!user.active){ document.getElementById("login-error").textContent = "This account has been deactivated. Contact your Client Admin."; return; }
    setSession({ type:"client", userId: user.id });
    showApp(); return;
  }
  document.getElementById("login-error").textContent = "Incorrect email or password.";
}

/* ---------------- Browser back/forward support ---------------- */
let isRestoringHistory = false;
function pushHistoryState(){
  if(isRestoringHistory) return;
  if(!getSession()) return;
  const state = { tab: currentTab, clientId: currentClientId, clientTab: currentClientTab, ticketId: currentTicketId, ticketsBack: currentClientTicketsBack, dashViewAsUserId: (typeof dashViewAsUserId!=="undefined"?dashViewAsUserId:null) };
  try{ history.pushState(state, ""); }catch(e){}
}
window.addEventListener("popstate", (e) => {
  const s = getSession();
  if(!s) return;
  isRestoringHistory = true;
  const st = e.state || { tab: s.type==="employee" ? "dashboard" : "cdashboard" };
  currentTab = st.tab; currentClientId = st.clientId||null; currentClientTab = st.clientTab||"overview";
  currentTicketId = st.ticketId||null; currentClientTicketsBack = st.ticketsBack||"tickets";
  if(typeof dashViewAsUserId!=="undefined") dashViewAsUserId = st.dashViewAsUserId||null;
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.tab===currentTab));
  if(currentTicketId && s.type==="employee"){ renderTicketDetailEmployee(currentTicketId); }
  else { render(); }
  isRestoringHistory = false;
});

function goToTab(tab){
  currentTab = tab; currentClientId=null; currentTicketId=null; currentPriorityFilter=null;

function prefersReducedMotion(){ return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
function animateIn(sel){
  if(prefersReducedMotion()) return;
  const el = document.querySelector(sel);
  if(!el) return;
  el.classList.remove("fade-in"); void el.offsetWidth; el.classList.add("fade-in");
}
function animateStagger(sel){
  if(prefersReducedMotion()) return;
  document.querySelectorAll(sel).forEach((el, i) => {
    el.classList.remove("fade-in-stagger");
    el.style.animationDelay = (i * 0.05) + "s";
    void el.offsetWidth;
    el.classList.add("fade-in-stagger");
  });
}
function openModal(html, wide){

  document.getElementById("modal-body").innerHTML = html;
  document.getElementById("overlay").classList.add("open");
  if(!prefersReducedMotion()){ document.getElementById("modal-body").classList.add("modal-pop"); }
}

function saveClient(id){
  const name = document.getElementById("f-name").value.trim();
  if(!name){ alert("Client name is required."); return; }
  const items = loadKey("clients")||[];
  const existing = items.find(i=>i.id===id);
  const websiteSections = Array.from(document.querySelectorAll(".f-section-check:checked")).map(c=>c.value);
  const record = Object.assign({}, existing, {
    id: id || uid(), name,
    company: document.getElementById("f-company").value.trim(),
    email: document.getElementById("f-email").value.trim(),
    phone: document.getElementById("f-phone").value.trim(),
    website: document.getElementById("f-website").value.trim(),
    status: document.getElementById("f-status").value,
    notes: document.getElementById("f-notes").value.trim(),
    websiteSections,
    onboardingDate: existing ? existing.onboardingDate : new Date().toISOString().slice(0,10),
    package: existing ? existing.package : { name:"Not set", price:0, services:[] },
    websiteStatus: existing ? existing.websiteStatus : { url: document.getElementById("f-website").value.trim(), status:"Not checked", hosting:"—", domain:"—", ssl:"—", maintenance:"—", lastChecked:null },
    assignedTeam: existing ? existing.assignedTeam : ["ankit","chandan","bhuvanesh","irfan"]
  });
  const idx = items.findIndex(i=>i.id===id);
  if(idx>-1) items[idx]=record; else items.push(record);
  saveKey("clients", items);
  logAudit(id?"Client Updated":"Client Onboarded","Clients", name, record.id);
  closeModal(); renderClients();
}

function renderTickets(){
  const initFilter = pendingTicketFilter; pendingTicketFilter = null;
  const tickets = loadKey("tickets")||[], clients = loadKey("clients")||[];
  const statusFilter = document.getElementById("tk-status")?.value ?? (initFilter?.status||"");
  const priorityFilter = document.getElementById("tk-priority")?.value ?? (initFilter?.priority||"");
  const openOnly = !document.getElementById("tk-status") && !!(initFilter && initFilter.openOnly);
  const search = (document.getElementById("tk-search")?.value || "").toLowerCase();
  const openStatuses = ["New","Assigned","In Progress","Waiting for Client"];
  const sorted = tickets.slice().sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  const filtered = sorted.filter(t=>{
    if(statusFilter && t.status!==statusFilter) return false;
    if(priorityFilter && t.priority!==priorityFilter) return false;
    if(openOnly && !openStatuses.includes(t.status)) return false;
    if(search){ const client = clients.find(c=>c.id===t.clientId); if(!(t.subject+t.id+(client?client.name:"")).toLowerCase().includes(search)) return false; }
    return true;
  });
  document.getElementById("main-content").innerHTML = `
    <div class="topbar"><div><h2>Tickets</h2><p>All client requests across every account</p></div><button class="btn" onclick="openTicketForm()">+ New Ticket</button></div>

      <select id="tk-priority" onchange="renderTickets()"><option value="">All priorities</option>${TICKET_PRIORITIES.map(p=>`<option ${p===priorityFilter?"selected":""}>${p}</option>`).join("")}</select>

      <table><thead><tr><th>ID</th><th>Subject</th><th>Client</th><th>Category</th><th>Priority</th><th>Status</th><th>Assigned</th></tr></thead>
      <tbody>
        ${filtered.length ? filtered.map(t=>{
          const client = clients.find(c=>c.id===t.clientId);
          return `<tr class="clickable" onclick="openTicketDetail('${t.id}', 'tickets')"><td class="mono">${t.id}</td><td><b>${escapeHtml(t.subject)}</b></td><td>${client?escapeHtml(client.name):"—"}</td><td>${escapeHtml(t.category)}</td><td><span class="pill ${priorityPill(t.priority)}">${t.priority}</span></td><td><span class="pill ${statusPill(t.status)}">${t.status}</span></td><td>${employeeName(t.assignedTo)}</td></tr>`;
        }).join("") : `<tr><td colspan="7" class="empty-row">No tickets match this filter.</td></tr>`}
      </tbody></table>
    </div>
  `;
}

function postReplyEmployee(ticketId){
  const text = document.getElementById("reply-text").value.trim(); if(!text) return;
  const tickets = loadKey("tickets")||[]; const t = tickets.find(x=>x.id===ticketId);
  t.comments.push({ author: currentActorName(), role:"internal", text, at:new Date().toISOString() });
  pushTicketHistory(t, `${currentActorName()} added a comment.`);
  if(t.status==="New") t.status="Assigned"; if(t.status==="Assigned") t.status="In Progress";
  saveKey("tickets", tickets);
  logAudit("Comment Added","Tickets",`Replied on ${ticketId}: "${text.slice(0,50)}${text.length>50?"…":""}"`, t.clientId, null, null, null, t.createdBy);
  renderTicketDetailEmployee(ticketId);
}
function updateTicketStatus(ticketId, newStatus){
  const tickets = loadKey("tickets")||[]; const t = tickets.find(x=>x.id===ticketId);
  const old = t.status; t.status = newStatus;
  if(newStatus==="Resolved" && !t.resolvedAt) t.resolvedAt = new Date().toISOString();
  pushTicketHistory(t, `${currentActorName()} changed status to ${newStatus}.`);
  saveKey("tickets", tickets);
  logAudit("Status Changed","Tickets",`${ticketId} status changed`, t.clientId, old, newStatus, null, t.createdBy);
  renderTicketDetailEmployee(ticketId);
}
function reassignTicket(ticketId, newAssignee){
  const tickets = loadKey("tickets")||[]; const t = tickets.find(x=>x.id===ticketId);
  const old = employeeName(t.assignedTo); t.assignedTo = newAssignee;
  pushTicketHistory(t, `Ticket reassigned to ${employeeName(newAssignee)} by ${currentActorName()}.`);
  saveKey("tickets", tickets);
  logAudit("Reassigned","Tickets",`${ticketId} reassigned`, t.clientId, old, employeeName(newAssignee), null, t.createdBy);
  renderTicketDetailEmployee(ticketId);
}

/* Who shares a given expense. Older records (no `participants`) are treated as an
   equal split across the whole team — the original behaviour. */
function expenseParticipants(e){
  const ids = EMPLOYEES.map(x=>x.id);
  if(e && Array.isArray(e.participants) && e.participants.length){
    const kept = e.participants.filter(id=>ids.includes(id));
    return kept.length ? kept : ids.slice();
  }
  return ids.slice();
}
function expenseShare(e){
  const p = expenseParticipants(e);
  return p.length ? Number(e.amount||0) / p.length : 0;
}
/* Greedy minimum-cash-flow settle-up. balances: {id: net}  (net>0 => owed money) */
function settleUp(balances){
  const debtors=[], creditors=[];
  Object.entries(balances).forEach(([id,v])=>{
    const r = Math.round(v*100)/100;
    if(r < -0.01) debtors.push({id, amt:-r});
    else if(r > 0.01) creditors.push({id, amt:r});
  });
  debtors.sort((a,b)=>b.amt-a.amt); creditors.sort((a,b)=>b.amt-a.amt);
  const tx=[]; let i=0, j=0, guard=0;
  while(i<debtors.length && j<creditors.length && guard++<500){
    const pay = Math.min(debtors[i].amt, creditors[j].amt);
    tx.push({ from:debtors[i].id, to:creditors[j].id, amt:Math.round(pay*100)/100 });
    debtors[i].amt -= pay; creditors[j].amt -= pay;
    if(debtors[i].amt <= 0.01) i++;
    if(creditors[j].amt <= 0.01) j++;
  }
  return tx;
}
function expenseSettlement(list){
  const paid = {}, owed = {};
  EMPLOYEES.forEach(e=>{ paid[e.id]=0; owed[e.id]=0; });
  list.forEach(e=>{
    const amt = Number(e.amount||0);
    const p = expenseParticipants(e);
    const share = p.length ? amt/p.length : 0;
    if(!(e.paidBy in paid)) paid[e.paidBy] = 0;
    paid[e.paidBy] = (paid[e.paidBy]||0) + amt;
    p.forEach(id=>{ if(!(id in owed)) owed[id]=0; owed[id] += share; });
  });
  const ids = Array.from(new Set([...Object.keys(paid), ...Object.keys(owed)]));
  const net = {}; ids.forEach(id=> net[id] = (paid[id]||0) - (owed[id]||0));
  return { paid, owed, net, ids, tx: settleUp(net) };
}

function ffDayBuckets(rows, days){
  const out = []; const now = new Date();
  for(let i=days-1;i>=0;i--){ const d = new Date(now); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);

function ffBarChart(days){
  const max = Math.max(1, ...days.map(d=>d.count));
  const n = days.length, W = 760, H = 170, padX = 8, padB = 16;
  const slot = (W - padX*2) / n, bw = Math.max(1, slot - (n>45?1:2));
  let bars = "", labels = "";
  const gid = "bg"+(_chartDefId++);
  days.forEach((d,i)=>{
    const h = Math.round((d.count/max) * (H - padB - 6));
    const x = padX + i*slot, y = H - padB - h;
    const delay = (i * Math.min(0.012, 0.5/n)).toFixed(3);
    bars += `<rect class="ff-bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,1)}" rx="2"
      fill="url(#${gid})" data-grow="1"
      style="transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .65s cubic-bezier(.2,.9,.25,1) ${delay}s;"
      ><title>${d.label}: ${d.count} view${d.count===1?"":"s"}</title></rect>`;
    if(i===0 || i===n-1 || i===Math.floor(n/2)) labels += `<text class="ff-axis" x="${(x+bw/2).toFixed(1)}" y="${H-3}" text-anchor="middle">${d.label}</text>`;
  });
  return `<svg class="ff-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8b85ff"/><stop offset="100%" stop-color="var(--accent)"/></linearGradient></defs>
    <g style="filter:drop-shadow(0 6px 10px rgba(79,70,229,.22));">${bars}</g>
    ${labels}
  </svg>`;
}
async function ffFetch(days){
  if(!_cloudReady || !_sb) return { error:"nocloud" };
  const since = new Date(Date.now() - days*86400000).toISOString();
  const { data, error } = await _sb.from(FOOTFALL_TABLE)
    .select("path,referrer,visitor_id,session_id,ts,country,country_code,city,product")
    .eq("site", FOOTFALL_SITE).gte("ts", since)
    .order("ts", { ascending:false }).limit(20000);
  if(error) return { error: error.message || String(error) };
  return { rows: data || [] };
}

async function ffLoad(){
  const body = document.getElementById("ff-body");
  if(!body) return;
  const res = await ffFetch(_ffRangeDays);
  const bodyNow = document.getElementById("ff-body");
  if(!bodyNow) return;
  if(res.error === "nocloud"){ bodyNow.innerHTML = `<div class="card"><p class="empty-row">Footfall needs the shared database, which isn't connected in this browser.</p></div>`; return; }
  if(res.error){
    const missing = /relation|does not exist|find the table|schema cache|not exist|column/i.test(res.error);
    bodyNow.innerHTML = `<div class="card"><p class="empty-row">${missing ? "The <b>thikops_footfall</b> table (or its country/city/product columns) isn't set up yet — run its SQL from SUPABASE_SETUP.md (see Setup below)." : escapeHtml("Couldn't load footfall: " + res.error)}</p></div>`;
    return;
  }
  _ffRows = res.rows || [];
  ffRender();
}
function ffRender(){
  const bodyNow = document.getElementById("ff-body");
  if(!bodyNow) return;
  const all = _ffRows;
  if(!all.length){
    bodyNow.innerHTML = `<div class="card"><p class="empty-row">No visits recorded yet for ${FOOTFALL_SITE}. Add a snippet from Setup below — views appear here within seconds.</p></div>`;
    return;
  }
  // ---- property (website vs product) split, computed on the full set ----
  const propViews = {}, propVis = {};
  all.forEach(r=>{ const k = ffRowProp(r); propViews[k] = (propViews[k]||0)+1; (propVis[k] = propVis[k] || new Set()).add(r.visitor_id); });
  const websiteVis = propVis[""] || new Set();
  const productVisAll = new Set();
  Object.entries(propVis).forEach(([k,set])=>{ if(k!=="") set.forEach(v=>productVisAll.add(v)); });
  const both = [...websiteVis].filter(v=>productVisAll.has(v)).length;
  const siteOnly = [...websiteVis].filter(v=>!productVisAll.has(v)).length;
  const prodOnly = [...productVisAll].filter(v=>!websiteVis.has(v)).length;

  // ---- apply the active property filter to everything below ----
  const rows = (_ffProp === "__all__") ? all : all.filter(r=> ffRowProp(r) === _ffProp);

  const dayStart = new Date(); dayStart.setHours(0,0,0,0);
  const todayCount = rows.filter(r=> new Date(r.ts) >= dayStart).length;
  const uniqVis = new Set(rows.map(r=>r.visitor_id).filter(Boolean)).size;
  const uniqSess = new Set(rows.map(r=>r.session_id).filter(Boolean)).size;
  const buckets = ffDayBuckets(rows, _ffRangeDays);
  const avg = Math.round(rows.length / _ffRangeDays);
  const byPath = ffGroupTop(rows, r=> r.path || "/", 8);
  const byRef  = ffGroupTop(rows, r=> ffRefHost(r.referrer), 8);

  // ---- country -> city ----
  const geo = {};
  rows.forEach(r=>{
    const c = r.country || "Unknown";
    const g = geo[c] || (geo[c] = { count:0, code:r.country_code || "", cities:{} });
    g.count++; if(!g.code && r.country_code) g.code = r.country_code;
    const city = r.city || "Unknown";
    g.cities[city] = (g.cities[city]||0) + 1;
  });
  const countries = Object.entries(geo).sort((a,b)=>b[1].count-a[1].count);
  const hasGeo = countries.some(([c])=> c !== "Unknown") || countries.length > 1;
  if(_ffCountry && !geo[_ffCountry]) _ffCountry = null;
  const drillCountry = _ffCountry || (countries[0] && countries[0][0]);
  const cityPairs = drillCountry && geo[drillCountry]
    ? Object.entries(geo[drillCountry].cities).sort((a,b)=>b[1]-a[1]).slice(0,12) : [];

  const recent = rows.slice(0, 15);
  const propTabs = [{id:"__all__",label:"All"}].concat(
    FOOTFALL_PROPS.filter(p=> (propViews[p.id]||0) > 0 || p.id==="").map(p=>({id:p.id,label:p.label}))
  );
  const propDonutData = FOOTFALL_PROPS.filter(p=>(propViews[p.id]||0)>0 || p.id==="").map(p=>({label:p.label, value:propViews[p.id]||0}));
  const countryDonutData = countries.slice(0,8).map(([c,g])=>({label:c, value:g.count}));

  bodyNow.innerHTML = `
    <div class="ff-prop-tabs">
      ${propTabs.map(t=>`<button class="${t.id===_ffProp?"active":""}" onclick="ffSetProp(${ffArg(t.id)})">${escapeHtml(t.label)}${t.id!=="__all__"?` <span style="opacity:.7;">${(propViews[t.id]||0).toLocaleString("en-IN")}</span>`:""}</button>`).join("")}
    </div>

    <div class="stat-grid">
      <div class="stat-card accent"><div class="label">Page views</div><div class="value" id="ff-stat-views">0</div></div>
      <div class="stat-card"><div class="label">Unique visitors</div><div class="value" id="ff-stat-uniq">0</div></div>
      <div class="stat-card"><div class="label">Sessions</div><div class="value" id="ff-stat-sess">0</div></div>
      <div class="stat-card"><div class="label">Views today</div><div class="value" id="ff-stat-today">0</div></div>
      <div class="stat-card"><div class="label">Avg / day</div><div class="value" id="ff-stat-avg">0</div></div>
    </div>

    <div class="card">
      <h3>Website vs products — where visitors go</h3>
      <div class="ff-crossover">
        <div class="box"><div class="n">${siteOnly.toLocaleString("en-IN")}</div><div class="l">Website only</div></div>
        <div class="box"><div class="n">${both.toLocaleString("en-IN")}</div><div class="l">Website + a product</div></div>
        <div class="box"><div class="n">${prodOnly.toLocaleString("en-IN")}</div><div class="l">Product only (no website)</div></div>
      </div>
      <div class="donut-row" style="margin-top:16px;">
        ${donutChart(propDonutData, {size:150, stroke:22, fmt:v=>v.toLocaleString("en-IN")+" views", highlight:l=>_ffProp!=="__all__" && ffPropLabel(_ffProp)===l})}
        <table style="flex:1;min-width:220px;"><thead><tr><th>Property</th><th style="text-align:right;">Views</th><th style="text-align:right;">Visitors</th></tr></thead><tbody>
          ${FOOTFALL_PROPS.filter(p=>(propViews[p.id]||0)>0 || p.id==="").map((p,i)=>`<tr><td><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${chartColor(i)};margin-right:7px;"></span>${escapeHtml(p.label)}</td><td style="text-align:right;"><b>${(propViews[p.id]||0).toLocaleString("en-IN")}</b></td><td style="text-align:right;">${((propVis[p.id]&&propVis[p.id].size)||0).toLocaleString("en-IN")}</td></tr>`).join("")}
        </tbody></table>
      </div>
    </div>

    <div class="card"><h3>Views per day — last ${_ffRangeDays} days${_ffProp!=="__all__"?` · ${escapeHtml(ffPropLabel(_ffProp))}`:""}</h3>${ffBarChart(buckets)}</div>

    <div class="card">
      <h3>Visitors by country &amp; city</h3>
      ${hasGeo ? `<div class="ff-geo-wrap with-donut">
        <div style="display:flex;align-items:center;justify-content:center;">${donutChart(countryDonutData, {size:150, stroke:22, fmt:v=>v.toLocaleString("en-IN")+" visits", highlight:l=>l===drillCountry})}</div>
        <div>
          ${countries.slice(0,12).map(([c,g])=>`<div class="ff-country-row ${c===drillCountry?"active":""}" onclick="ffSetCountry(${ffArg(c)})"><span><span class="flag">${ffFlag(g.code)}</span>${escapeHtml(c)}</span><b>${g.count.toLocaleString("en-IN")}</b></div>`).join("")}
        </div>
        <div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">Cities in <b>${escapeHtml(drillCountry||"—")}</b></div>
          ${ffMiniTable(cityPairs, "City", "Views")}
        </div>
      </div>` : `<p class="empty-row">No country data yet — it appears once track.js (with the geo lookup) has recorded new visits.</p>`}
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;">
      <div class="card"><h3>Top pages</h3>${ffMiniTable(byPath, "Page", "Views")}</div>
      <div class="card"><h3>Top referrers</h3>${ffMiniTable(byRef, "Source", "Views")}</div>
    </div>
    <div class="card" style="padding:0;overflow-x:auto;">
      <div style="padding:14px 16px 0;"><h3 style="margin:0;"><span class="ff-live-dot"></span>Recent visits</h3></div>
      <table><thead><tr><th>When</th><th>Property</th><th>Page</th><th>Location</th><th>Referrer</th></tr></thead>
      <tbody>${recent.map(r=>`<tr><td style="white-space:nowrap;">${fmtDateTime(r.ts)}</td><td>${escapeHtml(ffPropLabel(ffRowProp(r)))}</td><td style="word-break:break-all;">${escapeHtml(r.path||"/")}</td><td style="white-space:nowrap;">${ffFlag(r.country_code)}${escapeHtml([r.city, r.country].filter(Boolean).join(", ") || "—")}</td><td>${escapeHtml(ffRefHost(r.referrer))}</td></tr>`).join("")}</tbody></table>
    </div>
  `;
  countUp(document.getElementById("ff-stat-views"), rows.length, {});
  countUp(document.getElementById("ff-stat-uniq"), uniqVis, {});
  countUp(document.getElementById("ff-stat-sess"), uniqSess, {});
  countUp(document.getElementById("ff-stat-today"), todayCount, {});
  countUp(document.getElementById("ff-stat-avg"), avg, {});
  animateCharts(bodyNow);
}

const EMPTY_WEBSITE_CONTENT = { text:{}, photos:[], menu:[], offers:[], hours:[], contact:{}, testimonials:[], faqs:[], banner:{}, seo:{} };
function websiteRecordFor(clientId){
  seedWebsiteContentIfEmpty();
  const all = loadKey("websiteContent")||{};
  if(!all[clientId]) all[clientId] = { published: JSON.parse(JSON.stringify(EMPTY_WEBSITE_CONTENT)), draft: JSON.parse(JSON.stringify(EMPTY_WEBSITE_CONTENT)) };
  return all[clientId];
}
/* The DRAFT copy — every Manage Website edit reads and writes here, never touching what's published. */
function currentClientWebsiteContent(){
  return websiteRecordFor(currentClientRecord().id).draft;
}
function saveClientWebsiteContent(content){
  const client = currentClientRecord();
  const all = loadKey("websiteContent")||{};
  all[client.id].draft = content;
  saveKey("websiteContent", all);
}
function currentClientWebsitePublished(){
  return websiteRecordFor(currentClientRecord().id).published;
}
function websiteHasPendingChanges(clientId){
  const rec = websiteRecordFor(clientId);
  return JSON.stringify(rec.draft) !== JSON.stringify(rec.published);
}
function sectionHasPendingChanges(clientId, sectionId){
  const rec = websiteRecordFor(clientId);
  return JSON.stringify(rec.draft[sectionId]) !== JSON.stringify(rec.published[sectionId]);
}
function publishWebsiteDraft(){
  const client = currentClientRecord();
  const all = loadKey("websiteContent")||{};
  all[client.id].published = JSON.parse(JSON.stringify(all[client.id].draft));
  saveKey("websiteContent", all);
  logAudit("Website Published","Website","Draft changes published to the live site", client.id, null, null, currentClientUser().id);
  wmToast("Published ✓ — once your database is connected, this is what visitors will see.");
}
function discardWebsiteDraft(){
  if(!confirm("Discard all unpublished changes and revert to what's currently live? This can't be undone.")) return;
  const client = currentClientRecord();
  const all = loadKey("websiteContent")||{};
  all[client.id].draft = JSON.parse(JSON.stringify(all[client.id].published));
  saveKey("websiteContent", all);
  logAudit("Draft Discarded","Website","Unpublished changes discarded", client.id, null, null, currentClientUser().id);
  wmToast("Draft discarded — back to the published version.");
  renderManageWebsite();
}
function myWebsiteAccessSections(){
  const me = currentClientUser();
  if(me.isAdmin) return WEBSITE_SECTIONS.map(s=>s.id);
  return me.websiteAccess || [];

function clientEnabledSections(client){
  return client.websiteSections || WEBSITE_SECTIONS.map(s=>s.id);
