/* ---- Hash routing: keeps the address bar in sync so Ctrl/Cmd/middle-click on any
   nav item opens that exact tab in a new tab (sessionStorage carries over to it). ---- */
function navClick(e, tab){
  if(e.ctrlKey || e.metaKey || e.shiftKey || e.button===1) return true;
  e.preventDefault(); goToTab(tab); return false;
}
function wmNavClick(e, section){
  if(e.ctrlKey || e.metaKey || e.shiftKey || e.button===1) return true;
  e.preventDefault(); goToWebsiteSection(section); return false;
}
function syncHash(){
  const hash = currentTab==="cwebsite-manage" ? `#/cwebsite-manage/${websiteMgmtSection}` : `#/${currentTab}`;
  if(location.hash!==hash){ try{ history.replaceState(history.state, "", location.pathname+location.search+hash); }catch(e){} }
}
function applyHashRoute(){
  const h = location.hash.replace(/^#\/?/, "");
  if(!h) return null;
  const parts = h.split("/");
  if(parts[0]==="cwebsite-manage"){ if(parts[1]) websiteMgmtSection = parts[1]; return "cwebsite-manage"; }
  return parts[0] || null;
}

function wmDarkModeOn(){ return localStorage.getItem("thikops_wmDark")==="1"; }
function toggleWmDarkMode(){
  localStorage.setItem("thikops_wmDark", wmDarkModeOn() ? "0" : "1");
  /* Full re-render (not a classList patch on existing nodes) — toggling the class
     on already-rendered elements left some of them stuck on their pre-toggle color
     until the next repaint trigger. Fresh nodes always compute their style correctly. */
  renderManageWebsite();
}
function renderManageWebsite(){
  const client = currentClientRecord(), me = currentClientUser();
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.tab==="cwebsite"));
  const allowed = myWebsiteAccessSections();
  const enabled = clientEnabledSections(client);
  const visibleSections = WEBSITE_SECTIONS.filter(s=>allowed.includes(s.id) && enabled.includes(s.id));
  if(!visibleSections.length && !me.isAdmin){
    document.getElementById("main-content").innerHTML = `
      <div class="topbar"><div><h2>Manage Website</h2><p>${escapeHtml(client.name)}</p></div><button class="btn secondary" onclick="goToTab('cwebsite')">&larr; Website Overview</button></div>
      <div class="card"><p class="empty-row">You don't have access to update any part of the website yet. Ask your Client Admin to grant you access under Access.</p></div>`;
    return;
  }
  const sectionIsValid = (websiteMgmtSection==="access" ? me.isAdmin : websiteMgmtSection==="preview" ? true : visibleSections.some(s=>s.id===websiteMgmtSection));
  if(!sectionIsValid) websiteMgmtSection = visibleSections[0] ? visibleSections[0].id : "text";

function resizeImageFile(file, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale; canvas.height = img.height * scale;
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  const photos = currentClientWebsiteContent().photos||[];

    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="savePhoto('${id||""}')">Save</button></div>

  window._wmPhotoUrl = item.url || "";

}

};
const DEFAULT_BRAND_THEME = { bg:"#f7f8fc", surface:"#ffffff", surface2:"#eef0f5", ink:"#1d2030", muted:"#6b7080", accent:"#4f46e5", accentInk:"#ffffff", border:"#e3e5ec", radius:"14px", fontDisplay:"inherit", fontBody:"inherit" };
function clientBrandTheme(clientId){ return CLIENT_BRAND_THEMES[clientId] || DEFAULT_BRAND_THEME; }
function brandThemeStyle(theme){
  return `--site-bg:${theme.bg};--site-surface:${theme.surface};--site-surface2:${theme.surface2};--site-ink:${theme.ink};--site-muted:${theme.muted};--site-accent:${theme.accent};--site-accent-ink:${theme.accentInk};--site-border:${theme.border};--site-radius:${theme.radius};--site-font-display:${theme.fontDisplay};--site-font-body:${theme.fontBody};`;
}
function wmSitePreviewSection(id, label, innerHtml, draft, published){
  const changed = JSON.stringify(draft[id]) !== JSON.stringify(published[id]);
  return `<div class="wm-site-section ${changed?"updated":""}"><h2>${escapeHtml(label)}${changed?`<span class="wm-changed-badge">Updated</span>`:""}</h2>${innerHtml}</div>`;
}
function renderWmSitePreview(client, draft, published, enabled){
  const t = draft.text||{}, b = draft.banner||{};
  const theme = clientBrandTheme(client.id);
  let html = `<div class="wm-site-preview" style="${brandThemeStyle(theme)}"><div class="wm-site-brand-tag"><span class="wm-site-brand-dot"></span>Rendered in ${escapeHtml(client.name)}'s own site colors &amp; fonts, pulled from ${escapeHtml(client.website)}</div>`;
  if(enabled.includes("banner") && b.enabled && b.text){
    html += `<div class="wm-site-banner">${escapeHtml(b.text)}${b.linkLabel?(" — "+escapeHtml(b.linkLabel)):""}</div>`;
  }
  html += `<div class="wm-site-hero"><h1>${escapeHtml(t.heroTitle||client.name)}</h1><p>${escapeHtml(t.heroSubtitle||"")}</p></div>`;
  if(enabled.includes("text") && (t.aboutTitle||t.aboutBody)){
    html += wmSitePreviewSection("text","About", `<b>${escapeHtml(t.aboutTitle||"")}</b><p style="font-size:13px;color:var(--muted);">${escapeHtml(t.aboutBody||"")}</p>`, draft, published);
  }
  if(enabled.includes("photos")){
    const photos = draft.photos||[];
    const inner = photos.length ? `<div class="wm-site-gallery">${photos.map(p=>`<div class="wm-site-photo" style="${p.url?`background-image:url('${p.url}');`:""}">${p.url?"":escapeHtml(p.caption||"Photo")}</div>`).join("")}</div>` : `<p style="font-size:13px;color:var(--muted);">No photos yet.</p>`;
    html += wmSitePreviewSection("photos","Photos", inner, draft, published);
  }
  if(enabled.includes("menu")){
    const menu = draft.menu||[];
    const inner = menu.length ? menu.map(c=>`<div class="wm-site-menu-cat"><h4>${escapeHtml(c.name)}</h4>${c.items.map(it=>`<div class="wm-site-menu-item"><span>${escapeHtml(it.name)}</span><span>${it.price!=null?("₹"+it.price):"Enquire"}</span></div>`).join("")}</div>`).join("") : `<p style="font-size:13px;color:var(--muted);">No menu yet.</p>`;
    html += wmSitePreviewSection("menu","Menu & Prices", inner, draft, published);
  }
  if(enabled.includes("offers")){
    const offers = (draft.offers||[]).filter(o=>o.active);
    const inner = offers.length ? offers.map(o=>`<div class="wm-site-offer-card"><b>${escapeHtml(o.title)}</b><br>${escapeHtml(o.description||"")}</div>`).join("") : `<p style="font-size:13px;color:var(--muted);">No active offers.</p>`;

  const client = (loadKey("clients")||[]).find(c=>c.id===clientId);
  if(!admin || !client){ document.body.innerHTML = `<div style="padding:60px;text-align:center;font-family:sans-serif;">Client not found.</div>`; return; }
  setSession({ type:"client", userId: admin.id, employeeAccess:true });
  showApp();
  const banner = document.getElementById("impersonation-banner");
  banner.style.display = "block";
  banner.innerHTML = `🔧 ${BRAND} Team Access — viewing <b>${escapeHtml(client.name)}</b>'s account with full permissions. This tab is separate from your normal login.`;
}

/* ---------------- Standalone package landing page (opened in a new tab) ---------------- */
function renderPackageLandingPage(pkgId, forClientId){
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "none";
  document.getElementById("demo-banner").style.display = "none";
  const pkg = PACKAGE_CATALOG.find(p=>p.id===pkgId);
  const client = (loadKey("clients")||[]).find(c=>c.id===forClientId);
  const el = document.getElementById("package-landing");
  el.style.display = "block";
  if(!pkg){ el.innerHTML = `<div style="padding:60px;text-align:center;">Package not found.</div>`; return; }
  el.innerHTML = `
    <div class="pkg-landing-wrap" style="max-width:560px;margin:0 auto;padding:60px 20px;">
      <span class="back-link" onclick="window.location.href=location.pathname">&larr; Back to your account</span>
      <div class="logo-badge" style="margin-bottom:16px;">${LOGO_IMG}</div>
      ${pkg.mostChosen?`<span class="pill orange" style="margin-bottom:8px;">Most Chosen</span>`:""}
      <h1 style="font-size:24px;margin:0 0 4px;">${escapeHtml(pkg.name)}</h1>
      <p style="color:var(--muted);margin:0 0 4px;">${escapeHtml(pkg.tagline||"")}</p>
      <p style="color:var(--muted);margin:0 0 20px;font-size:12.5px;">${client?("For "+escapeHtml(client.name)+" · "):""}${BRAND} Ops</p>
      <div class="card">
        <div style="font-size:30px;font-weight:800;color:var(--accent);">${pkg.custom?fmtMoney(pkg.price)+"+":fmtMoney(pkg.price)}</div>
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;">${escapeHtml(pkg.priceNote||"")} · excl. 18% GST</div>
        <div style="font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">What's Included</div>
        <ul style="margin:0 0 20px;padding-left:18px;font-size:14px;line-height:2;">${pkg.services.map(s=>`<li>${escapeHtml(s)}</li>`).join("")}</ul>
        ${pkg.custom ? "" : `<button class="btn" style="width:100%;margin-bottom:10px;" onclick="mockBuyPackage('${pkg.id}','${forClientId||""}')">Buy This Package</button>`}
        <div style="display:flex;gap:10px;">
          <a class="btn ${pkg.custom?"":"secondary"} small" style="flex:1;text-align:center;text-decoration:none;box-sizing:border-box;" href="mailto:bhuvanesh@thikaana.co?subject=${encodeURIComponent((pkg.custom?"Let's discuss requirements — ":"Interested in ")+pkg.name)}">${pkg.custom?"Let's Discuss Your Requirements":"Connect with Bhuvanesh"}</a>
          ${pkg.custom?"":`<a class="btn secondary small" style="flex:1;text-align:center;text-decoration:none;box-sizing:border-box;" href="mailto:irfan@thikaana.co?subject=${encodeURIComponent("Interested in "+pkg.name)}">Connect with Irfan</a>`}
        </div>
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin-top:16px;">Use the link above, or just close this tab, to return to your account anytime.</p>
    </div>
  `;
  animateIn("#package-landing");
}
function mockBuyPackage(pkgId, clientId){
  const pkg = PACKAGE_CATALOG.find(p=>p.id===pkgId);
  logAudit("Package Interest","Packages", `Interested in upgrading to ${pkg.name}`, clientId||null);
  alert("Thanks! This is a demo — in the live version this would start checkout. Our team will reach out to confirm.");
}

/* ---------------- Init / routing ---------------- */
function reflectCloudStatus(){
  const banner = document.getElementById("demo-banner");
  if(_cloudReady && banner){
    banner.innerHTML = "SHARED TEAM WORKSPACE — live data synced across the ठिkaana team via Supabase.";
  }
}
(async function boot(){
  await initCloud();
  reflectCloudStatus();
  seedIfEmpty();
  populateDemoHint();
  const _urlParams = new URLSearchParams(window.location.search);
  if(_urlParams.get("viewPackage")){
    renderPackageLandingPage(_urlParams.get("viewPackage"), _urlParams.get("forClient"));
  } else if(_urlParams.get("asClient")){
    loginAsClientEmployeeAccess(_urlParams.get("asClient"));
  } else {
    const _s = getSession();
    if(_s){ showApp(applyHashRoute()); }
  }
})();
</script>
</body>
</html>
