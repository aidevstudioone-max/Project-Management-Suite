<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ठिkaana Ops</title>
<style>
  :root{
    --bg:#f4f5f9; --card:#ffffff; --border:#e3e5ec; --text:#1d2030; --muted:#6b7080;
    --sidebar:#171a2b; --sidebar-text:#c7c9db; --sidebar-active:#2a2f4a;
    --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef0fe;
    --danger:#e0393e; --danger-soft:#fdeaea; --success:#16a34a; --success-soft:#e9f8ee;
    --warn:#b26a00; --warn-soft:#fef3e0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  #demo-banner{background:#1d2030;color:#fff;font-size:12.5px;padding:7px 16px;text-align:center;}
  #demo-banner b{color:#ffcf70;}

  #login-screen{min-height:calc(100vh - 34px);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#171a2b,#2a2f6a);}
  .login-box{background:var(--card);padding:40px 36px;border-radius:16px;width:380px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center;}
  .logo-badge{width:56px;height:56px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;margin:0 auto 14px;}
  .login-box h1{font-size:20px;margin:0 0 4px;}
  .login-box p.sub{color:var(--muted);font-size:13px;margin:0 0 22px;}
  .login-box input{width:100%;padding:11px 12px;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;}
  .login-box button{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;margin-top:6px;}
  .login-box button:hover{background:var(--accent-hover);}
  #login-error{color:var(--danger);font-size:12.5px;min-height:18px;margin-top:2px;}
  .demo-hint{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:9px 12px;font-size:11.5px;margin-top:10px;text-align:left;line-height:1.6;max-height:150px;overflow-y:auto;}
  .demo-hint b{display:block;margin:6px 0 2px;}
  .demo-hint b:first-child{margin-top:0;}

  #app{display:none;min-height:100vh;}
  .shell{display:flex;min-height:calc(100vh - 34px);}
  .sidebar{width:222px;background:var(--sidebar);color:var(--sidebar-text);flex-shrink:0;display:flex;flex-direction:column;padding:16px 12px;}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;}
  .sidebar .brand .logo-badge{width:34px;height:34px;font-size:16px;border-radius:9px;margin:0;}
  .sidebar .brand b{color:#fff;font-size:15px;}
  .sidebar .brand span{display:block;font-size:10.5px;color:#9497b3;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--sidebar-text);font-size:13.3px;cursor:pointer;margin-bottom:2px;user-select:none;}
  .nav-item:hover{background:#20233c;}
  .nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600;}
  .nav-item .ic{width:18px;text-align:center;}
  .nav-item .count{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px;}
  .nav-sub{padding-left:26px;}
  .nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#666a86;padding:14px 12px 4px;}

  .acting-as{background:#20233c;border-radius:8px;padding:9px 10px;margin-bottom:10px;}
  .acting-as label{display:block;font-size:10px;color:#9497b3;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  .acting-as select{width:100%;background:#171a2b;color:#fff;border:1px solid #33375a;border-radius:6px;padding:6px 7px;font-size:12.5px;}

  .sidebar-org{background:#20233c;border-radius:8px;padding:9px 10px;margin-bottom:10px;font-size:12px;}
  .sidebar-org b{display:block;color:#fff;font-size:13px;}

  .sidebar-footer{margin-top:auto;padding-top:8px;border-top:1px solid #262a44;}
  .sidebar-footer button{width:100%;padding:8px;background:#262a44;color:#fff;border:none;border-radius:7px;font-size:12.5px;}
  .sidebar-footer button:hover{background:#31355a;}

  .main{flex:1;padding:26px 32px;overflow-y:auto;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .topbar h2{margin:0 0 2px;font-size:21px;}
  .topbar p{margin:0;color:var(--muted);font-size:13px;}
  .btn{padding:9px 16px;border-radius:8px;border:none;font-size:13.5px;font-weight:600;background:var(--accent);color:#fff;}
  .btn:hover{background:var(--accent-hover);}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.secondary:hover{background:#f0f1f6;}
  .btn.danger{background:var(--danger-soft);color:var(--danger);}
  .btn.small{padding:5px 10px;font-size:12px;border-radius:6px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;}
  .stat-card.clickable{cursor:pointer;}
  .stat-card.clickable:hover{border-color:var(--accent);}
  .stat-card .label{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
  .stat-card .value{font-size:21px;font-weight:700;}
  .stat-card .value.small{font-size:16px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .card h3{margin:0 0 14px;font-size:14.5px;}
  .two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  @media (max-width:900px){ .two-col{grid-template-columns:1fr;} }

  .toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap;}
  .toolbar input[type=text],.toolbar input[type=search],.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:#fff;}
  .toolbar .grow{flex:1;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px 10px;border-bottom:1px solid #eef0f5;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr.clickable:hover{background:#f7f8fc;cursor:pointer;}
  .empty-row{text-align:center;color:var(--muted);padding:30px !important;}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .pill.gray{background:#eef0f5;color:#555a72;}
  .pill.green{background:var(--success-soft);color:var(--success);}
  .pill.red{background:var(--danger-soft);color:var(--danger);}
  .pill.blue{background:var(--accent-soft);color:var(--accent);}
  .pill.yellow{background:#fef6e0;color:#a5720b;}
  .pill.orange{background:var(--warn-soft);color:var(--warn);}
  .mono{font-family:ui-monospace,Consolas,monospace;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{border:1px solid var(--border);background:#fff;border-radius:6px;padding:5px 8px;font-size:12px;}
  .icon-btn:hover{background:#f0f1f6;}
  .pw-cell{display:flex;align-items:center;gap:6px;}

  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .team-card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .team-card .avatar{width:44px;height:44px;font-size:16px;}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;}

  .comment{display:flex;gap:10px;margin-bottom:14px;}
  .comment .avatar{width:28px;height:28px;font-size:11px;}
  .comment .bubble{background:#f5f6fa;border-radius:10px;padding:9px 12px;flex:1;}
  .comment.mine .bubble{background:var(--accent-soft);}
  .comment .meta{font-size:11.5px;color:var(--muted);margin-bottom:3px;}
  .comment .meta b{color:var(--text);}
  .comment .text{font-size:13px;line-height:1.5;white-space:pre-wrap;}

  .history-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f0f1f5;font-size:12.5px;}
  .history-item:last-child{border-bottom:none;}
  .history-item .time{color:var(--muted);white-space:nowrap;min-width:120px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;}
  .tab-btn{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab-btn:hover{color:var(--text);}

  .priority-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px;}
  .priority-card{border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;border:1px solid transparent;}
  .priority-card .num{font-size:26px;font-weight:800;}
  .priority-card .lbl{font-size:12px;font-weight:600;margin-top:2px;}
  .priority-card:hover{border-color:currentColor;}
  .priority-card.Urgent{background:var(--danger-soft);color:var(--danger);}
  .priority-card.High{background:var(--warn-soft);color:var(--warn);}
  .priority-card.Medium{background:var(--accent-soft);color:var(--accent);}
  .priority-card.Low{background:#eef0f5;color:#555a72;}
  .priority-card.active{outline:2px solid currentColor;}

  .overlay{position:fixed;inset:0;background:rgba(15,17,32,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:24px 26px;}
  .modal.wide{max-width:720px;}
  .modal h3{margin:0 0 16px;font-size:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:#464a5c;margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .checkbox-group{display:flex;flex-wrap:wrap;gap:10px;}
  .checkbox-group label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:7px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .action-item-row{display:flex;gap:6px;margin-bottom:8px;align-items:center;}
  .action-item-row input[type=text]{flex:2;}
  .action-item-row input[type=date]{flex:1.2;}
  .action-item-row select{flex:1;}
  .action-item-row .icon-btn{flex:0;}
  .priority-choice{display:flex;gap:8px;}
  .priority-choice label{flex:1;text-align:center;padding:9px 4px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);}
  .priority-choice input{display:none;}
  .priority-choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .perm-list{display:flex;flex-direction:column;gap:6px;}
  .perm-list label{display:flex;align-items:center;gap:8px;font-size:13px;}

  .back-link{font-size:12.5px;color:var(--accent);cursor:pointer;margin-bottom:10px;display:inline-block;}
  .profile-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .profile-stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px;}
  .profile-stats div{font-size:12.5px;color:var(--muted);}
  .profile-stats b{display:block;color:var(--text);font-size:17px;font-weight:700;}
  .status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--success);margin-right:6px;}

  ::placeholder{color:#a7abbd;}

  /* ---- v2 additions: presence, status boxes, clickable stats, animations ---- */
  .presence-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;position:relative;top:-1px;}
  .presence-dot.glow{animation:presencePulse 2s infinite;}
  @keyframes presencePulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.55);}70%{box-shadow:0 0 0 7px rgba(22,163,74,0);}100%{box-shadow:0 0 0 0 rgba(22,163,74,0);}}
  .presence-select{background:#171a2b;color:#fff;border:1px solid #33375a;border-radius:6px;padding:5px 6px;font-size:11.5px;width:100%;}

  .status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
  .status-box{border-radius:var(--radius);padding:14px;text-align:center;border:1.5px solid transparent;transition:transform .15s ease,box-shadow .15s ease;}
  .status-box .num{font-size:22px;font-weight:800;}
  .status-box .lbl{font-size:11px;font-weight:600;margin-top:2px;}

  .stat-card{transition:transform .15s ease,box-shadow .15s ease;}
  .stat-card.clickable:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(24,30,60,.08);}
  .card{transition:box-shadow .15s ease;}
  .priority-card{transition:transform .15s ease;}
  .priority-card:hover{transform:translateY(-2px);}

  .stat-card.accent{border-top:3px solid var(--accent);}
  .stat-card.accent-danger{border-top:3px solid var(--danger);}
  .stat-card.accent-success{border-top:3px solid var(--success);}
  .stat-card.accent-warn{border-top:3px solid var(--warn);}
  .stat-card.accent-gray{border-top:3px solid #9aa0b4;}

  #impersonation-banner{display:none;background:#3d2c00;color:#ffcf70;font-size:12.5px;padding:8px 16px;text-align:center;}
  #package-landing{display:none;background:var(--bg);min-height:100vh;}
  .other-pkg-card{cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;}
  .other-pkg-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(24,30,60,.08);border-color:var(--accent);}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .fade-in{animation:fadeInUp .35s ease-out both;}
  .fade-in-stagger{animation:fadeInUp .4s ease-out both;}
  @keyframes modalPop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  .modal-pop{animation:modalPop .22s ease-out both;}
  @media (prefers-reduced-motion: reduce){ .fade-in,.fade-in-stagger,.modal-pop{animation:none;} }
</style>
</head>
<body>

<div id="demo-banner">DEMO MODE — dummy data only, nothing here is connected to a real database yet. Login: <b>support@thikaana.co</b> / <b>demo123</b> (Thikaana team) — client demo logins shown on the login screen.</div>
<div id="impersonation-banner"></div>

<div id="package-landing"></div>

<div id="login-screen">
  <div class="login-box">
    <div class="logo-badge">ठ</div>
    <h1>ठिkaana Ops</h1>
    <p class="sub">Sign in to continue</p>
    <input type="text" id="login-email" placeholder="Email">
    <input type="password" id="login-pass" placeholder="Password">
    <div id="login-error"></div>
    <button onclick="attemptLogin()">Sign In</button>
    <div class="demo-hint" id="demo-hint"></div>
  </div>
</div>

<div id="app">
  <div class="shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div id="global-back-bar" style="display:none;"><span class="back-link" onclick="history.back()">&larr; Back</span></div>
      <div id="main-content"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal-body"></div>
</div>

<script>
/* Restore the pretty /Project-Management-Suite/Thikaana_Ops URL after the
   404.html handoff (GitHub Pages has no server-side routing — see 404.html). */
(function(){
  let redirected;
  try{ redirected = sessionStorage.getItem("pms_redirect"); }catch(e){ redirected = null; }
  if(redirected){
    try{ sessionStorage.removeItem("pms_redirect"); }catch(e){}
    try{ history.replaceState(null, "", redirected); }catch(e){}
  }
})();

/* ================= CONFIG ================= */
const BRAND = "ठिkaana";
const SHARED_LOGIN = { email: "support@thikaana.co", password: "demo123" };
const DEMO_PASSWORD = "demo123";

// Static page in this same repo — calls Google Places directly from the browser
// using a key entered on that page (saved in that page's own localStorage).
const LEAD_GEN_URL = "leadgen.html";

const SEED_EMPLOYEES = [
  { id:"ankit", name:"Ankit Prakash", email:"ankit@thikaana.co", phone:"+91 98100 00001", title:"Founder", department:"Leadership", role:"Administrator", type:"technical", permissions:"full", active:true },
  { id:"chandan", name:"Chandan Jha", email:"chandan@thikaana.co", phone:"+91 98100 00002", title:"Chief Technology Officer", department:"Technology", role:"CTO", type:"technical", permissions:"full", active:true },
  { id:"bhuvanesh", name:"Bhuvanesh Meethal", email:"bhuvanesh@thikaana.co", phone:"+91 98100 00003", title:"Director – Client Relations", department:"Client Relations", role:"Client Relations", type:"nontechnical", permissions:"full", active:true },
  { id:"irfan", name:"Irfan Azmi", email:"irfan@thikaana.co", phone:"+91 98100 00004", title:"Director – Customer Success", department:"Customer Success", role:"Customer Success", type:"nontechnical", permissions:"full", active:true }
];
let EMPLOYEES = [];
function persistEmployees(){ saveKey("employees", EMPLOYEES); }

const PACKAGE_CATALOG = [
  { id:"starter", name:"Website Only", price:35000, services:["Website Development","Hosting"] },
  { id:"growth", name:"Website + Maintenance", price:52000, services:["Website Development","Hosting","Monthly Maintenance"] },
  { id:"seo", name:"Website Development + SEO", price:75000, services:["Website Development","Hosting","Domain Management","Monthly Maintenance","Technical Support","SEO"] },
  { id:"support", name:"Website + Maintenance + Support", price:68000, services:["Website Development","Hosting","Domain Management","Monthly Maintenance","Technical Support"] },
  { id:"scale", name:"Full Growth Package", price:120000, services:["Website Development","Hosting","Domain Management","Monthly Maintenance","Technical Support","SEO","AI Automation Add-on","Priority Support"] }
];
const DEFAULT_ROLES = ["Owner","Manager","Marketing Manager","IT Manager","Admin","Finance","Client User"];
const PRESENCE_OPTIONS = ["Active","On Break","Offline"];
function presenceColor(p){ return {Active:"#16a34a","On Break":"#d97706",Offline:"#9aa0b4"}[p] || "#9aa0b4"; }
function presenceDot(p){ return `<span class="presence-dot ${p==="Active"?"glow":""}" style="background:${presenceColor(p||"Offline")};"></span>`; }
function getRoleOptions(){ const custom = loadKey("customRoles")||[]; return [...DEFAULT_ROLES, ...custom.filter(r=>!DEFAULT_ROLES.includes(r))]; }
function addCustomRole(role){ if(!role) return; const custom = loadKey("customRoles")||[]; if(!getRoleOptions().includes(role)){ custom.push(role); saveKey("customRoles", custom); } }

const VAULT_CATEGORIES = ["Domain & Hosting","Google Workspace","Social Media","Banking & Payments","Software & Tools","Email","Other"];
const EXPENSE_CATEGORIES = ["Software & Subscriptions","Marketing & Ads","Office & Admin","Travel","Salaries & Contractors","Client Project Cost","Domain & Hosting","Other"];
const CLIENT_STATUSES = ["Lead","Prospect","Active","On Hold","Completed","Inactive"];
const TICKET_CATEGORIES = ["Technical Issue","Website Issue","Content Update","Design Change","Domain / Hosting","Email","General Request","Other"];
const TECHNICAL_CATEGORIES = ["Technical Issue","Website Issue","Domain / Hosting","Email"];
const TICKET_PRIORITIES = ["Low","Medium","High","Urgent"];
const TICKET_STATUSES = ["New","Assigned","In Progress","Waiting for Client","Resolved","Closed"];

const KEYS = ["clients","clientUsers","tickets","meetings","vault","expenses","audit","employees","customRoles"];
const SEED_VERSION = "3";

function loadKey(k){ try{ return JSON.parse(localStorage.getItem("thikops_"+k)) || null; }catch(e){ return null; } }
function saveKey(k, v){ localStorage.setItem("thikops_"+k, JSON.stringify(v)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtMoney(n){ return "₹" + Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return "—"; const dt=new Date(d+"T00:00:00"); if(isNaN(dt)) return d; return dt.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}); }
function fmtDateTime(iso){ if(!iso) return "—"; const dt=new Date(iso); return dt.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) + " " + dt.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function employeeName(id){ const e=EMPLOYEES.find(x=>x.id===id); return e?e.name:(id||"—"); }
function employeeOptions(selected){ return EMPLOYEES.map(e=>`<option value="${e.id}" ${e.id===selected?"selected":""}>${e.name} (${e.title})</option>`).join(""); }
function initials(name){ return (name||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function priorityPill(p){ return {Low:"gray",Medium:"blue",High:"orange",Urgent:"red"}[p]||"gray"; }
function statusPill(s){ return {New:"blue","Assigned":"yellow","In Progress":"orange","Waiting for Client":"gray",Resolved:"green",Closed:"gray"}[s]||"gray"; }

function nextAssignee(category){
  const isTech = TECHNICAL_CATEGORIES.includes(category);
  const pool = EMPLOYEES.filter(e => e.type === (isTech ? "technical" : "nontechnical")).map(e=>e.id);
  const rrKey = "thikops_rr_" + (isTech?"tech":"nontech");
  let idx = parseInt(sessionStorage.getItem(rrKey) || "0", 10);
  const chosen = pool[idx % pool.length];
  sessionStorage.setItem(rrKey, String(idx+1));
  return chosen;
}

function attemptLogin(){
  const email = document.getElementById("login-email").value.trim().toLowerCase();
  const pass = document.getElementById("login-pass").value;
  if(email === SHARED_LOGIN.email && pass === SHARED_LOGIN.password){
    setSession({ type:"employee", actingAs: "ankit" });
    showApp(); return;
  }
  const user = (loadKey("clientUsers")||[]).find(u=>u.email.toLowerCase()===email);
  if(user && pass === DEMO_PASSWORD){
    if(!user.active){ document.getElementById("login-error").textContent = "This account has been deactivated. Contact your Client Admin."; return; }
    setSession({ type:"client", userId: user.id });
    showApp(); return;
  }
  document.getElementById("login-error").textContent = "Incorrect email or password.";
}
document.getElementById("login-pass").addEventListener("keydown", e => { if(e.key==="Enter") attemptLogin(); });
document.getElementById("login-email").addEventListener("keydown", e => { if(e.key==="Enter") attemptLogin(); });

/* ================= TAB ROUTER ================= */
let currentTab = "dashboard";
let currentClientId = null, currentClientTab = "overview", currentTicketId = null, currentPriorityFilter = null, currentClientTicketsBack = null;

/* ---------------- Browser back/forward support ---------------- */
let isRestoringHistory = false;
function pushHistoryState(){
  if(isRestoringHistory) return;
  if(!getSession()) return;
  const state = { tab: currentTab, clientId: currentClientId, clientTab: currentClientTab, ticketId: currentTicketId, ticketsBack: currentClientTicketsBack, dashViewAsUserId: (typeof dashViewAsUserId!=="undefined"?dashViewAsUserId:null) };
  try{ history.pushState(state, ""); }catch(e){}
}
window.addEventListener("popstate", (e) => {
  const s = getSession();
  if(!s) return;
  isRestoringHistory = true;
  const st = e.state || { tab: s.type==="employee" ? "dashboard" : "cdashboard" };
  currentTab = st.tab; currentClientId = st.clientId||null; currentClientTab = st.clientTab||"overview";
  currentTicketId = st.ticketId||null; currentClientTicketsBack = st.ticketsBack||"tickets";
  if(typeof dashViewAsUserId!=="undefined") dashViewAsUserId = st.dashViewAsUserId||null;
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.tab===currentTab));
  if(currentTicketId && s.type==="employee"){ renderTicketDetailEmployee(currentTicketId); }
  else { render(); }
  isRestoringHistory = false;
});

function goToTab(tab){
  currentTab = tab; currentClientId=null; currentTicketId=null; currentPriorityFilter=null;
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.tab===tab));
  render();
  pushHistoryState();
}

  const map = s.type==="employee" ? empRenderers : clientRenderers;
  (map[currentTab]||map[Object.keys(map)[0]])();
  animateIn("#main-content");
  const homeTab = s.type==="employee" ? "dashboard" : "cdashboard";
  const backBar = document.getElementById("global-back-bar");
  if(backBar) backBar.style.display = (currentTab===homeTab) ? "none" : "block";
}
function prefersReducedMotion(){ return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
function animateIn(sel){
  if(prefersReducedMotion()) return;
  const el = document.querySelector(sel);
  if(!el) return;
  el.classList.remove("fade-in"); void el.offsetWidth; el.classList.add("fade-in");
}
function animateStagger(sel){
  if(prefersReducedMotion()) return;
  document.querySelectorAll(sel).forEach((el, i) => {
    el.classList.remove("fade-in-stagger");
    el.style.animationDelay = (i * 0.05) + "s";
    void el.offsetWidth;
    el.classList.add("fade-in-stagger");
  });
}
function openModal(html, wide){
  document.getElementById("modal-body").className = "modal" + (wide?" wide":"");
  document.getElementById("modal-body").innerHTML = html;
  document.getElementById("overlay").classList.add("open");
  if(!prefersReducedMotion()){ document.getElementById("modal-body").classList.add("modal-pop"); }
}
function closeModal(){ document.getElementById("overlay").classList.remove("open"); document.getElementById("modal-body").innerHTML=""; }
document.getElementById("overlay").addEventListener("click", e => { if(e.target.id==="overlay") closeModal(); });

/* ================= TICKETS (employee: global queue + detail) ================= */
function renderTickets(){
  const initFilter = pendingTicketFilter; pendingTicketFilter = null;
  const tickets = loadKey("tickets")||[], clients = loadKey("clients")||[];
  const statusFilter = document.getElementById("tk-status")?.value ?? (initFilter?.status||"");
  const priorityFilter = document.getElementById("tk-priority")?.value ?? (initFilter?.priority||"");
  const openOnly = !document.getElementById("tk-status") && !!(initFilter && initFilter.openOnly);
  const search = (document.getElementById("tk-search")?.value || "").toLowerCase();
  const openStatuses = ["New","Assigned","In Progress","Waiting for Client"];
  const sorted = tickets.slice().sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  const filtered = sorted.filter(t=>{
    if(statusFilter && t.status!==statusFilter) return false;
    if(priorityFilter && t.priority!==priorityFilter) return false;
    if(openOnly && !openStatuses.includes(t.status)) return false;
    if(search){ const client = clients.find(c=>c.id===t.clientId); if(!(t.subject+t.id+(client?client.name:"")).toLowerCase().includes(search)) return false; }
    return true;
  });
  document.getElementById("main-content").innerHTML = `
    <div class="topbar"><div><h2>Tickets</h2><p>All client requests across every account</p></div><button class="btn" onclick="openTicketForm()">+ New Ticket</button></div>
    <div class="toolbar">
      <input type="search" id="tk-search" placeholder="Search subject, ID or client..." class="grow" oninput="renderTickets()">
      <select id="tk-status" onchange="renderTickets()"><option value="">All statuses</option>${TICKET_STATUSES.map(s=>`<option ${s===statusFilter?"selected":""}>${s}</option>`).join("")}</select>
      <select id="tk-priority" onchange="renderTickets()"><option value="">All priorities</option>${TICKET_PRIORITIES.map(p=>`<option ${p===priorityFilter?"selected":""}>${p}</option>`).join("")}</select>

function postReplyEmployee(ticketId){
  const text = document.getElementById("reply-text").value.trim(); if(!text) return;
  const tickets = loadKey("tickets")||[]; const t = tickets.find(x=>x.id===ticketId);
  t.comments.push({ author: currentActorName(), role:"internal", text, at:new Date().toISOString() });
  pushTicketHistory(t, `${currentActorName()} added a comment.`);
  if(t.status==="New") t.status="Assigned"; if(t.status==="Assigned") t.status="In Progress";
  saveKey("tickets", tickets);
  logAudit("Comment Added","Tickets",`Replied on ${ticketId}: "${text.slice(0,50)}${text.length>50?"…":""}"`, t.clientId, null, null, null, t.createdBy);
  renderTicketDetailEmployee(ticketId);
}
function updateTicketStatus(ticketId, newStatus){
  const tickets = loadKey("tickets")||[]; const t = tickets.find(x=>x.id===ticketId);
  const old = t.status; t.status = newStatus;
  if(newStatus==="Resolved" && !t.resolvedAt) t.resolvedAt = new Date().toISOString();
  pushTicketHistory(t, `${currentActorName()} changed status to ${newStatus}.`);
  saveKey("tickets", tickets);
  logAudit("Status Changed","Tickets",`${ticketId} status changed`, t.clientId, old, newStatus, null, t.createdBy);
  renderTicketDetailEmployee(ticketId);
}
function reassignTicket(ticketId, newAssignee){
  const tickets = loadKey("tickets")||[]; const t = tickets.find(x=>x.id===ticketId);
  const old = employeeName(t.assignedTo); t.assignedTo = newAssignee;
  pushTicketHistory(t, `Ticket reassigned to ${employeeName(newAssignee)} by ${currentActorName()}.`);
  saveKey("tickets", tickets);
  logAudit("Reassigned","Tickets",`${ticketId} reassigned`, t.clientId, old, employeeName(newAssignee), null, t.createdBy);
  renderTicketDetailEmployee(ticketId);
}

    u.name = name; u.role = role;
    saveKey("clientUsers", users);
    logAudit("Client User Updated","Client Users", `${name}'s details updated`, client.id, null, null, currentClientUser().id);
  } else {
    const email = document.getElementById("f-email").value.trim();
    if(!email){ alert("Email is required."); return; }
    const record = { id: uid(), clientId: client.id, name, email, role, isAdmin:false, active:true, presence:"Active" };
    users.push(record); saveKey("clientUsers", users);
    logAudit("Client User Added","Client Users", `${name} added to ${client.name} (password: demo123)`, client.id, null, null, currentClientUser().id);
  }
  closeModal(); renderClientUsers();
}
function toggleClientUserActive(id){
  const users = loadKey("clientUsers")||[]; const u = users.find(x=>x.id===id); u.active = !u.active; saveKey("clientUsers", users);
  logAudit(u.active?"User Activated":"User Deactivated","Client Users", u.name, u.clientId, null, null, currentClientUser().id);
  renderClientUsers();
}
function deleteClientUser(id){
  const users = loadKey("clientUsers")||[]; const u = users.find(x=>x.id===id);
  if(u.isAdmin){ alert("You can't remove the Client Admin. Transfer admin rights first."); return; }
  if(!confirm(`Remove ${u.name} from this account?`)) return;
  saveKey("clientUsers", users.filter(x=>x.id!==id));
  logAudit("User Removed","Client Users", u.name, u.clientId, null, null, currentClientUser().id);
  renderClientUsers();
}
function renderClientHistory(){
  const client = currentClientRecord(), me = currentClientUser();
  let history = (loadKey("audit")||[]).filter(a=>a.clientId===client.id);
  if(!me.isAdmin){ history = history.filter(a => a.actorUserId===me.id || a.relatedUserId===me.id); }
  history = history.sort((a,b)=>(b.at||"").localeCompare(a.at||""));
  document.getElementById("main-content").innerHTML = `
    <div class="topbar"><div><h2>History</h2><p>${me.isAdmin?"Full activity on your account":"Activity related to you"}</p></div></div>
    <div class="card">${history.length ? history.map(h=>`<div class="history-item"><div class="time">${fmtDateTime(h.at)}</div><div>${escapeHtml(h.summary)}</div></div>`).join("") : `<p class="empty-row">No history yet.</p>`}</div>
  `;
}
function renderClientOwnProfile(){
  const user = currentClientUser(), client = currentClientRecord();
  const team = (loadKey("clientUsers")||[]).filter(u=>u.clientId===client.id && u.id!==user.id);
  document.getElementById("main-content").innerHTML = `
    <div class="topbar"><div><h2>Profile</h2><p>Your account details</p></div></div>
    <div class="card" style="max-width:480px;">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;"><div class="avatar" style="width:52px;height:52px;font-size:18px;">${initials(user.name)}</div><div><div style="font-weight:700;font-size:16px;">${escapeHtml(user.name)}${presenceDot(user.presence)}</div><div style="color:var(--muted);font-size:13px;">${escapeHtml(user.role)}${user.isAdmin?" · Client Admin":""}</div></div></div>
      <div style="font-size:13.5px;line-height:2.1;">Email: ${escapeHtml(user.email)}<br>Organization: ${escapeHtml(client.name)}<br>Company: ${escapeHtml(client.company)}</div>
    </div>
    ${user.isAdmin ? `<div class="card" style="max-width:480px;"><h3>Your Team</h3>${team.length ? team.map(u=>`<div style="display:flex;align-items:center;gap:9px;padding:7px 0;"><div class="avatar">${initials(u.name)}</div><div style="flex:1;"><div style="font-size:13px;font-weight:600;">${escapeHtml(u.name)}${presenceDot(u.presence)}</div><div style="font-size:11.5px;color:var(--muted);">${escapeHtml(u.role)} · ${u.active?"Active":"Deactivated"}</div></div></div>`).join("") : `<p style="color:var(--muted);font-size:13px;margin:0;">No other users yet.</p>`}</div>` : ""}
  `;
}

/* ---------------- Employee access into a client account ---------------- */
function loginAsClient(clientId){
  window.open(location.pathname + "?asClient=" + encodeURIComponent(clientId), "_blank");
}
function loginAsClientEmployeeAccess(clientId){
  const users = loadKey("clientUsers")||[];
  const admin = users.find(u=>u.clientId===clientId && u.isAdmin) || users.find(u=>u.clientId===clientId);
  const client = (loadKey("clients")||[]).find(c=>c.id===clientId);
  if(!admin || !client){ document.body.innerHTML = `<div style="padding:60px;text-align:center;font-family:sans-serif;">Client not found.</div>`; return; }
  setSession({ type:"client", userId: admin.id, employeeAccess:true });
  showApp();
  const banner = document.getElementById("impersonation-banner");
  banner.style.display = "block";
  banner.innerHTML = `🔧 ${BRAND} Team Access — viewing <b>${escapeHtml(client.name)}</b>'s account with full permissions. This tab is separate from your normal login.`;
}

/* ---------------- Standalone package landing page (opened in a new tab) ---------------- */
function renderPackageLandingPage(pkgId, forClientId){
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "none";
  document.getElementById("demo-banner").style.display = "none";
  const pkg = PACKAGE_CATALOG.find(p=>p.id===pkgId);
  const client = (loadKey("clients")||[]).find(c=>c.id===forClientId);
  const el = document.getElementById("package-landing");
  el.style.display = "block";
  if(!pkg){ el.innerHTML = `<div style="padding:60px;text-align:center;">Package not found.</div>`; return; }
  el.innerHTML = `
    <div style="max-width:560px;margin:0 auto;padding:60px 20px;">
      <span class="back-link" onclick="window.location.href=location.pathname">&larr; Back to your account</span>
      <div class="logo-badge" style="margin-bottom:16px;">ठ</div>
      <h1 style="font-size:24px;margin:0 0 4px;">${escapeHtml(pkg.name)}</h1>
      <p style="color:var(--muted);margin:0 0 20px;">${client?("For "+escapeHtml(client.name)+" · "):""}${BRAND} Ops</p>
      <div class="card">
        <div style="font-size:30px;font-weight:800;color:var(--accent);margin-bottom:14px;">${fmtMoney(pkg.price)}</div>
        <div style="font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">What's Included</div>
        <ul style="margin:0 0 20px;padding-left:18px;font-size:14px;line-height:2;">${pkg.services.map(s=>`<li>${escapeHtml(s)}</li>`).join("")}</ul>
        <button class="btn" style="width:100%;margin-bottom:10px;" onclick="mockBuyPackage('${pkg.id}','${forClientId||""}')">Buy This Package</button>
        <div style="display:flex;gap:10px;">
          <a class="btn secondary small" style="flex:1;text-align:center;text-decoration:none;box-sizing:border-box;" href="mailto:bhuvanesh@thikaana.co?subject=${encodeURIComponent("Interested in "+pkg.name)}">Connect with Bhuvanesh</a>
          <a class="btn secondary small" style="flex:1;text-align:center;text-decoration:none;box-sizing:border-box;" href="mailto:irfan@thikaana.co?subject=${encodeURIComponent("Interested in "+pkg.name)}">Connect with Irfan</a>
        </div>
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin-top:16px;">Use the link above, or just close this tab, to return to your account anytime.</p>
    </div>
  `;
  animateIn("#package-landing");
}
function mockBuyPackage(pkgId, clientId){
  const pkg = PACKAGE_CATALOG.find(p=>p.id===pkgId);
  logAudit("Package Interest","Packages", `Interested in upgrading to ${pkg.name}`, clientId||null);
  alert("Thanks! This is a demo — in the live version this would start checkout. Our team will reach out to confirm.");
}

/* ---------------- Init / routing ---------------- */
seedIfEmpty();
populateDemoHint();
const _urlParams = new URLSearchParams(window.location.search);
if(_urlParams.get("viewPackage")){
  renderPackageLandingPage(_urlParams.get("viewPackage"), _urlParams.get("forClient"));
} else if(_urlParams.get("asClient")){
  loginAsClientEmployeeAccess(_urlParams.get("asClient"));
} else {
  const _s = getSession();
  if(_s){ showApp(); }
}
</script>
