<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Portal (Demo) — Project Management Suite</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f4f5f9; --card:#ffffff; --border:#e3e5ec; --text:#1d2030; --muted:#6b7080;
    --sidebar:#171a2b; --sidebar-text:#c7c9db; --sidebar-active:#2a2f4a;
    --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef0fe;
    --danger:#e0393e; --danger-soft:#fdeaea; --success:#16a34a; --success-soft:#e9f8ee;
    --warn:#b26a00; --warn-soft:#fef3e0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  button{font-family:inherit;cursor:pointer;color:var(--text);}
  input,select,textarea{font-family:inherit;color:var(--text);}

  #demo-banner{background:#1d2030;color:#fff;font-size:12.5px;padding:7px 16px;text-align:center;}
  #demo-banner b{color:#ffcf70;}

  #login-screen{min-height:calc(100vh - 34px);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#171a2b,#2a2f6a);}
  .login-box{background:var(--card);padding:40px 36px;border-radius:16px;width:380px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center;}
  .logo-badge{width:56px;height:56px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;margin:0 auto 14px;}
  .login-box h1{font-size:20px;margin:0 0 4px;}
  .login-box p.sub{color:var(--muted);font-size:13px;margin:0 0 22px;}
  .login-box input{width:100%;padding:11px 12px;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;}
  .login-box button{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;margin-top:6px;}
  .login-box button:hover{background:var(--accent-hover);}
  #login-error{color:var(--danger);font-size:12.5px;min-height:18px;margin-top:2px;}
  .demo-hint{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:9px 12px;font-size:11.5px;margin-top:10px;text-align:left;line-height:1.6;max-height:150px;overflow-y:auto;}
  .demo-hint b{display:block;margin:6px 0 2px;}
  .demo-hint b:first-child{margin-top:0;}

  #app{display:none;min-height:100vh;}
  .shell{display:flex;min-height:calc(100vh - 34px);}
  .sidebar{width:222px;background:var(--sidebar);color:var(--sidebar-text);flex-shrink:0;display:flex;flex-direction:column;padding:16px 12px;}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;}
  .sidebar .brand .logo-badge{width:34px;height:34px;font-size:16px;border-radius:9px;margin:0;}
  .sidebar .brand b{color:#fff;font-size:15px;}
  .sidebar .brand span{display:block;font-size:10.5px;color:#9497b3;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--sidebar-text);font-size:13.3px;cursor:pointer;margin-bottom:2px;user-select:none;}
  .nav-item:hover{background:#20233c;}
  .nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600;}
  .nav-item .ic{width:18px;text-align:center;}

  .sidebar-org{background:#20233c;border-radius:8px;padding:9px 10px;margin-bottom:10px;font-size:12px;}
  .sidebar-org b{display:block;color:#fff;font-size:13px;}

  .sidebar-footer{margin-top:auto;padding-top:8px;border-top:1px solid #262a44;}
  .sidebar-footer button{width:100%;padding:8px;background:#262a44;color:#fff;border:none;border-radius:7px;font-size:12.5px;}
  .sidebar-footer button:hover{background:#31355a;}

  .main{flex:1;padding:26px 32px;overflow-y:auto;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .topbar h2{margin:0 0 2px;font-size:21px;}
  .topbar p{margin:0;color:var(--muted);font-size:13px;}
  .btn{padding:9px 16px;border-radius:8px;border:none;font-size:13.5px;font-weight:600;background:var(--accent);color:#fff;}
  .btn:hover{background:var(--accent-hover);}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.secondary:hover{background:#f0f1f6;}
  .btn.small{padding:5px 10px;font-size:12px;border-radius:6px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;transition:transform .15s ease,box-shadow .15s ease;}
  .stat-card .label{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
  .stat-card .value{font-size:21px;font-weight:700;}
  .stat-card .value.small{font-size:16px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .card h3{margin:0 0 14px;font-size:14.5px;}
  .two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  @media (max-width:900px){ .two-col{grid-template-columns:1fr;} }

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px 10px;border-bottom:1px solid #eef0f5;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr.clickable:hover{background:#f7f8fc;cursor:pointer;}
  .empty-row{text-align:center;color:var(--muted);padding:30px !important;}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .pill.gray{background:#eef0f5;color:#555a72;}
  .pill.green{background:var(--success-soft);color:var(--success);}
  .pill.red{background:var(--danger-soft);color:var(--danger);}
  .pill.blue{background:var(--accent-soft);color:var(--accent);}
  .pill.yellow{background:#fef6e0;color:#a5720b;}
  .pill.orange{background:var(--warn-soft);color:var(--warn);}
  .mono{font-family:ui-monospace,Consolas,monospace;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{border:1px solid var(--border);background:#fff;border-radius:6px;padding:5px 8px;font-size:12px;}
  .icon-btn:hover{background:#f0f1f6;}

  .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}

  .comment{display:flex;gap:10px;margin-bottom:14px;}
  .comment .bubble{background:#f5f6fa;border-radius:10px;padding:9px 12px;flex:1;}
  .comment.mine .bubble{background:var(--accent-soft);}
  .comment .meta{font-size:11.5px;color:var(--muted);margin-bottom:3px;}
  .comment .meta b{color:var(--text);}
  .comment .text{font-size:13px;line-height:1.5;white-space:pre-wrap;}

  .history-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f0f1f5;font-size:12.5px;}
  .history-item:last-child{border-bottom:none;}
  .history-item .time{color:var(--muted);white-space:nowrap;min-width:120px;}

  .priority-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px;}
  .priority-card{border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;border:1px solid transparent;transition:transform .15s ease;}
  .priority-card .num{font-size:26px;font-weight:800;}
  .priority-card .lbl{font-size:12px;font-weight:600;margin-top:2px;}
  .priority-card:hover{border-color:currentColor;transform:translateY(-2px);}
  .priority-card.Urgent{background:var(--danger-soft);color:var(--danger);}
  .priority-card.High{background:var(--warn-soft);color:var(--warn);}
  .priority-card.Medium{background:var(--accent-soft);color:var(--accent);}
  .priority-card.Low{background:#eef0f5;color:#555a72;}
  .priority-card.active{outline:2px solid currentColor;}

  .overlay{position:fixed;inset:0;background:rgba(15,17,32,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:24px 26px;}
  .modal h3{margin:0 0 16px;font-size:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:#464a5c;margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .priority-choice{display:flex;gap:8px;}
  .priority-choice label{flex:1;text-align:center;padding:9px 4px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);}
  .priority-choice input{display:none;}
  .priority-choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}

  .back-link{font-size:12.5px;color:var(--accent);cursor:pointer;margin-bottom:10px;display:inline-block;}
  .status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--success);margin-right:6px;}

  ::placeholder{color:#a7abbd;}

  .presence-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;position:relative;top:-1px;}
  .presence-dot.glow{animation:presencePulse 2s infinite;}
  @keyframes presencePulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.55);}70%{box-shadow:0 0 0 7px rgba(22,163,74,0);}100%{box-shadow:0 0 0 0 rgba(22,163,74,0);}}
  .presence-select{background:#171a2b;color:#fff;border:1px solid #33375a;border-radius:6px;padding:5px 6px;font-size:11.5px;width:100%;}

  #package-landing{display:none;background:var(--bg);min-height:100vh;}
  .other-pkg-card{cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;}
  .other-pkg-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(24,30,60,.08);border-color:var(--accent);}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .fade-in{animation:fadeInUp .35s ease-out both;}
  @media (prefers-reduced-motion: reduce){ .fade-in{animation:none;} }
</style>
</head>
<body>

<div id="demo-banner">DEMO MODE — a live preview of the Client Portal, using fictional client accounts. Demo logins are shown on the sign-in screen.</div>

<div id="package-landing"></div>

<div id="login-screen">
  <div class="login-box">
    <div class="logo-badge">P</div>
    <h1>Client Portal</h1>
    <p class="sub">Sign in to your PM Suite account</p>
    <input type="text" id="login-email" placeholder="Email">
    <input type="password" id="login-pass" placeholder="Password">
    <div id="login-error"></div>
    <button onclick="attemptLogin()">Sign In</button>
    <div class="demo-hint" id="demo-hint"></div>
  </div>
</div>

<div id="app">
  <div class="shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div id="global-back-bar" style="display:none;"><span class="back-link" onclick="history.back()">&larr; Back</span></div>
      <div id="main-content"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal-body"></div>
</div>

<script>
/* ================= CONFIG ================= */
const BRAND = "PM Suite";
const DEMO_PASSWORD = "demo123";

const SEED_EMPLOYEES = [
  { id:"ankit", name:"Ankit Prakash", email:"ankit@pmsuite.example.com", title:"Founder", type:"technical" },
  { id:"chandan", name:"Chandan Jha", email:"chandan@pmsuite.example.com", title:"Chief Technology Officer", type:"technical" },
  { id:"bhuvanesh", name:"Bhuvanesh Meethal", email:"bhuvanesh@pmsuite.example.com", title:"Director – Client Relations", type:"nontechnical" },
  { id:"irfan", name:"Irfan Azmi", email:"irfan@pmsuite.example.com", title:"Director – Customer Success", type:"nontechnical" }
];
const EMPLOYEES = SEED_EMPLOYEES.slice();

const PACKAGE_CATALOG = [
  { id:"starter", name:"Website Only", price:35000, services:["Website Development","Hosting"] },
  { id:"growth", name:"Website + Maintenance", price:52000, services:["Website Development","Hosting","Monthly Maintenance"] },
  { id:"seo", name:"Website Development + SEO", price:75000, services:["Website Development","Hosting","Domain Management","Monthly Maintenance","Technical Support","SEO"] },
  { id:"support", name:"Website + Maintenance + Support", price:68000, services:["Website Development","Hosting","Domain Management","Monthly Maintenance","Technical Support"] },
  { id:"scale", name:"Full Growth Package", price:120000, services:["Website Development","Hosting","Domain Management","Monthly Maintenance","Technical Support","SEO","AI Automation Add-on","Priority Support"] }
];
const DEFAULT_ROLES = ["Owner","Manager","Marketing Manager","IT Manager","Admin","Finance","Client User"];
const PRESENCE_OPTIONS = ["Active","On Break","Offline"];
function presenceColor(p){ return {Active:"#16a34a","On Break":"#d97706",Offline:"#9aa0b4"}[p] || "#9aa0b4"; }
function presenceDot(p){ return `<span class="presence-dot ${p==="Active"?"glow":""}" style="background:${presenceColor(p||"Offline")};"></span>`; }
function getRoleOptions(){ const custom = loadKey("customRoles")||[]; return [...DEFAULT_ROLES, ...custom.filter(r=>!DEFAULT_ROLES.includes(r))]; }
function addCustomRole(role){ if(!role) return; const custom = loadKey("customRoles")||[]; if(!getRoleOptions().includes(role)){ custom.push(role); saveKey("customRoles", custom); } }

const TICKET_CATEGORIES = ["Technical Issue","Website Issue","Content Update","Design Change","Domain / Hosting","Email","General Request","Other"];
const TECHNICAL_CATEGORIES = ["Technical Issue","Website Issue","Domain / Hosting","Email"];
const TICKET_PRIORITIES = ["Low","Medium","High","Urgent"];
const TICKET_STATUSES = ["New","Assigned","In Progress","Waiting for Client","Resolved","Closed"];

const SEED_VERSION = "1";

function loadKey(k){ try{ return JSON.parse(localStorage.getItem("pmsdemo_"+k)) || null; }catch(e){ return null; } }
function saveKey(k, v){ localStorage.setItem("pmsdemo_"+k, JSON.stringify(v)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtMoney(n){ return "₹" + Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return "—"; const dt=new Date(d+"T00:00:00"); if(isNaN(dt)) return d; return dt.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}); }
function fmtDateTime(iso){ if(!iso) return "—"; const dt=new Date(iso); return dt.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) + " " + dt.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function employeeName(id){ const e=EMPLOYEES.find(x=>x.id===id); return e?e.name:(id||"—"); }
function initials(name){ return (name||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function priorityPill(p){ return {Low:"gray",Medium:"blue",High:"orange",Urgent:"red"}[p]||"gray"; }
function statusPill(s){ return {New:"blue","Assigned":"yellow","In Progress":"orange","Waiting for Client":"gray",Resolved:"green",Closed:"gray"}[s]||"gray"; }

/* ---------------- Seed data (fresh install only) ---------------- */
function seedIfEmpty(){
  if(loadKey("clients") && localStorage.getItem("pmsdemo_seedVersion")===SEED_VERSION) return;
  localStorage.setItem("pmsdemo_seedVersion", SEED_VERSION);

  const clients = [
    { id:"c-pavmantra", name:"Golden Crust Bakery", company:"Golden Crust Bakery Pvt Ltd", website:"goldencrustbakery.example.com", email:"hello@goldencrustbakery.example.com", phone:"+91 98200 11221", status:"Active", onboardingDate:"2026-03-10", notes:"Bakery brand site — menu, story, ordering enquiries.",
      package:{ name:"Website Development + SEO", price:75000, services:["Website Development","Hosting","Domain Management","Monthly Maintenance","Technical Support","SEO"] },
      websiteStatus:{ url:"goldencrustbakery.example.com", status:"Online", hosting:"Active", domain:"Active", ssl:"Valid", maintenance:"Up to date", lastChecked:"2026-08-20T09:00:00" } },
    { id:"c-apoorva", name:"Metro Auto Parts", company:"Metro Auto Parts Pvt Ltd", website:"metroautoparts.example.com", email:"sales@metroautoparts.example.com", phone:"+91 98110 44552", status:"Active", onboardingDate:"2026-02-18", notes:"Auto parts supplier — catalogue, coverage area, enquiries.",
      package:{ name:"Website + Maintenance", price:52000, services:["Website Development","Hosting","Monthly Maintenance"] },
      websiteStatus:{ url:"metroautoparts.example.com", status:"Online", hosting:"Active", domain:"Active", ssl:"Valid", maintenance:"Up to date", lastChecked:"2026-08-20T09:00:00" } },
    { id:"c-hangout", name:"Cafe Bloom", company:"Cafe Bloom & Restaurant", website:"cafebloom.example.com", email:"contact@cafebloom.example.com", phone:"+91 90040 77332", status:"Active", onboardingDate:"2026-04-02", notes:"Cafe & restaurant site — menu, location, dine-in info.",
      package:{ name:"Website Only", price:38000, services:["Website Development","Hosting"] },
      websiteStatus:{ url:"cafebloom.example.com", status:"Online", hosting:"Active", domain:"Active", ssl:"Valid", maintenance:"Up to date", lastChecked:"2026-08-19T18:00:00" } },
    { id:"c-srima", name:"Wellcare Diagnostics", company:"Wellcare Diagnostic & Medical Centre", website:"wellcarediagnostics.example.com", email:"info@wellcarediagnostics.example.com", phone:"+91 97110 22990", status:"Active", onboardingDate:"2026-01-25", notes:"Diagnostic centre & pharmacy — test listings, reports, pharmacy.",
      package:{ name:"Website + Maintenance + Support", price:68000, services:["Website Development","Hosting","Domain Management","Monthly Maintenance","Technical Support"] },
      websiteStatus:{ url:"wellcarediagnostics.example.com", status:"Online", hosting:"Active", domain:"Renewing Soon", ssl:"Valid", maintenance:"Up to date", lastChecked:"2026-08-20T07:30:00" } },
    { id:"c-sriram", name:"Silver Leaf Gifts", company:"Silver Leaf Gift Emporium", website:"silverleafgifts.example.com", email:"store@silverleafgifts.example.com", phone:"+91 94350 66210", status:"Active", onboardingDate:"2026-05-14", notes:"Gift & home décor retailer — collections, store story.",
      package:{ name:"Website Only", price:31000, services:["Website Development","Hosting"] },
      websiteStatus:{ url:"silverleafgifts.example.com", status:"Online", hosting:"Active", domain:"Active", ssl:"Valid", maintenance:"Up to date", lastChecked:"2026-08-19T12:00:00" } },
    { id:"c-shibpur", name:"Riverside Public School", company:"Riverside Public High School", website:"riversideschool.example.edu", email:"office@riversideschool.example.edu", phone:"+91 98300 55127", status:"Active", onboardingDate:"2026-03-28", notes:"School information site — facilities & contact.",
      package:{ name:"Website + Maintenance", price:40000, services:["Website Development","Hosting","Monthly Maintenance"] },
      websiteStatus:{ url:"riversideschool.example.edu", status:"Online", hosting:"Active", domain:"Active", ssl:"Valid", maintenance:"Up to date", lastChecked:"2026-08-20T08:00:00" } }
  ];
  saveKey("clients", clients);

  const clientUsers = [
    { id:"cu-1", clientId:"c-pavmantra", name:"Karan Mehta", email:"karan@goldencrustbakery.example.com", role:"Owner", isAdmin:true, active:true, presence:"Active" },
    { id:"cu-2", clientId:"c-pavmantra", name:"Divya Kapoor", email:"divya@goldencrustbakery.example.com", role:"Marketing Manager", isAdmin:false, active:true, presence:"On Break" },
    { id:"cu-3", clientId:"c-apoorva", name:"Sanjay Oberoi", email:"sanjay@metroautoparts.example.com", role:"Owner", isAdmin:true, active:true, presence:"Active" },
    { id:"cu-4", clientId:"c-hangout", name:"Neha Sharma", email:"neha@cafebloom.example.com", role:"Manager", isAdmin:true, active:true, presence:"Active" },
    { id:"cu-5", clientId:"c-srima", name:"Dr. Ritu Malhotra", email:"ritu@wellcarediagnostics.example.com", role:"Owner", isAdmin:true, active:true, presence:"Offline" },
    { id:"cu-6", clientId:"c-srima", name:"Arjun Malhotra", email:"arjun@wellcarediagnostics.example.com", role:"Admin", isAdmin:false, active:true, presence:"Active" },
    { id:"cu-7", clientId:"c-sriram", name:"Pooja Anand", email:"pooja@silverleafgifts.example.com", role:"Owner", isAdmin:true, active:true, presence:"Active" },
    { id:"cu-8", clientId:"c-shibpur", name:"Simran Kaur", email:"simran@riversideschool.example.edu", role:"Admin / IT Coordinator", isAdmin:true, active:true, presence:"Active" }
  ];
  saveKey("clientUsers", clientUsers);

  const now = Date.now(); const daysAgo = n => new Date(now - n*86400000).toISOString();
  function mkHistory(entries){ return entries.map(e=>({ text:e[0], at:e[1] })); }

  const tickets = [
    { id:"t-1001", clientId:"c-pavmantra", createdBy:"cu-1", subject:"Online ordering form not submitting", description:"Customers report the enquiry form on the ordering page spins forever and never confirms.", category:"Technical Issue", priority:"Urgent", status:"In Progress", assignedTo:"chandan", createdAt:daysAgo(2), assignedAt:daysAgo(2), pageUrl:"goldencrustbakery.example.com/order",
      comments:[
        {author:"Karan Mehta", role:"client", text:"Website contact form is not working.", at:daysAgo(2)},
        {author:"Chandan Jha", role:"internal", text:"We are checking the issue.", at:daysAgo(1.5)},
        {author:"Karan Mehta", role:"client", text:"Okay, thank you.", at:daysAgo(1.4)}

/* ================= URL ROUTING (client/user pretty paths) ================= */
const REPO_SEGMENT = "Project-Management-Suite";
function slugify(s){ return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-+|-+$)/g,""); }
function clientSlug(client){ return slugify(client.name); }
function userSlugForClient(user){ return slugify((user.name||"").split(" ")[0]) || slugify(user.name) || user.id; }
function findClientBySlug(slug){ return (loadKey("clients")||[]).find(c => clientSlug(c) === slug); }
function findClientUserBySlug(client, slug){ return (loadKey("clientUsers")||[]).filter(u=>u.clientId===client.id).find(u => userSlugForClient(u) === slug); }
function basePath(){
  const parts = location.pathname.split("/").filter(Boolean);
  if(parts[0] && parts[0].toLowerCase() === REPO_SEGMENT.toLowerCase()) return "/" + parts[0];
  return "";
}
function routeSlugFromPath(pathname){
  let parts = pathname.split("/").filter(Boolean);
  if(parts[0] && parts[0].toLowerCase() === REPO_SEGMENT.toLowerCase()) parts = parts.slice(1);
  if(!parts.length) return null;
  const first = parts[0].replace(/\.html$/i,"");
  if(first === "portal" || first === "index" || first === "") return null;
  return first;
}
function restoreRedirectedPath(){
  let redirected;
  try{ redirected = sessionStorage.getItem("pms_redirect"); }catch(e){ redirected = null; }
  if(redirected){
    try{ sessionStorage.removeItem("pms_redirect"); }catch(e){}
    try{ history.replaceState(null, "", redirected); }catch(e){}
  }
}
function resolveRoute(){
  const slug = routeSlugFromPath(location.pathname);
  if(!slug || slug.toLowerCase() === "demo") return { type:"demo" };
  const underscoreIdx = slug.lastIndexOf("_");
  if(underscoreIdx > 0){
    const cSlug = slug.slice(0, underscoreIdx), uSlug = slug.slice(underscoreIdx+1);
    const client = findClientBySlug(cSlug);
    const user = client ? findClientUserBySlug(client, uSlug) : null;
    if(client && user) return { type:"client-user", client, user };
    if(client) return { type:"client", client };
    return { type:"demo" };
  }
  const client = findClientBySlug(slug);
  return client ? { type:"client", client } : { type:"demo" };
}
function urlForUser(user){
  const client = (loadKey("clients")||[]).find(c=>c.id===user.clientId);
  return `${basePath()}/${clientSlug(client)}_${userSlugForClient(user)}`;
}
function urlForClient(client){ return `${basePath()}/${clientSlug(client)}`; }
function urlForDemo(){ return `${basePath()}/demo`; }

function applyLoginScreenForRoute(route){
  const heading = document.querySelector("#login-screen .login-box h1");

    heading.textContent = route.client.name;
    sub.textContent = "Sign in to your Client Portal account";
    const users = allUsers.filter(u=>u.clientId===route.client.id);

      users.map(u=>`${escapeHtml(u.email)} — ${escapeHtml(u.name)}${u.isAdmin?" (Admin)":""}`).join("<br>");

  } else {

    sub.textContent = "Sign in to your PM Suite account";

}

  if(!getSession()) return;
  isRestoringHistory = true;
  const st = e.state || { tab: "cdashboard" };
  currentTab = st.tab; currentTicketId = st.ticketId||null; dashViewAsUserId = st.dashViewAsUserId||null;

});

      <tbody>${filtered.length ? filtered.map(t=>`<tr class="clickable" onclick="openClientTicketDetail('${t.id}')"><td class="mono">${t.id}</td><td><b>${escapeHtml(t.subject)}</b></td><td>${escapeHtml(t.category)}</td><td><span class="pill ${priorityPill(t.priority)}">${t.priority}</span></td><td><span class="pill ${statusPill(t.status)}">${t.status}</span></td><td>${employeeName(t.assignedTo)}</td></tr>`).join("") : `<tr><td colspan="6" class="empty-row">No requests${currentPriorityFilter?" at this priority":""} yet.</td></tr>`}</tbody></table>
    </div>
  `;
}
function openClientTicketDetail(id){ currentTicketId = id; currentTab = "crequests"; document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.tab==="crequests")); render(); pushHistoryState(); }
function renderClientTicketDetail(id){
  const t = (loadKey("tickets")||[]).find(x=>x.id===id);
  document.getElementById("main-content").innerHTML = `
    <div class="topbar"><div><h2>${escapeHtml(t.subject)}</h2><p class="mono">${t.id} · opened ${fmtDateTime(t.createdAt)}</p></div><div style="display:flex;gap:8px;"><span class="pill ${priorityPill(t.priority)}">${t.priority}</span><span class="pill ${statusPill(t.status)}">${t.status}</span></div></div>
    <div class="two-col">
      <div>
        <div class="card"><h3>Description</h3><p style="font-size:13.5px;line-height:1.6;margin:0;">${escapeHtml(t.description)}</p></div>
        <div class="card"><h3>Conversation</h3>
          <div>${t.comments.length ? t.comments.map(c=>`<div class="comment ${c.role==='client'?'mine':''}"><div class="avatar">${initials(c.author)}</div><div class="bubble"><div class="meta"><b>${escapeHtml(c.author)}</b> · ${c.role==='client'?'You':BRAND} · ${fmtDateTime(c.at)}</div><div class="text">${escapeHtml(c.text)}</div></div></div>`).join("") : `<p style="color:var(--muted);font-size:13px;">No messages yet.</p>`}</div>
          <div class="field" style="margin-top:14px;"><label>Add a comment</label><textarea id="reply-text"></textarea></div>
          <button class="btn small" onclick="postReplyClient('${t.id}')">Send</button>
        </div>
      </div>
      <div>
        <div class="card"><h3>Handled By</h3><div style="display:flex;align-items:center;gap:9px;"><div class="avatar">${initials(employeeName(t.assignedTo))}</div><div style="font-size:13.5px;font-weight:600;">${employeeName(t.assignedTo)}</div></div></div>
        <div class="card"><h3>Details</h3><div style="font-size:12.5px;color:var(--muted);line-height:1.8;">Category: ${escapeHtml(t.category)}<br>${t.pageUrl?("Page: "+escapeHtml(t.pageUrl)+"<br>"):""}Raised: ${fmtDateTime(t.createdAt)}<br>${t.resolvedAt?("Resolved: "+fmtDateTime(t.resolvedAt)):""}</div></div>
      </div>
    </div>
  `;
}
function postReplyClient(ticketId){
  const text = document.getElementById("reply-text").value.trim(); if(!text) return;
  const tickets = loadKey("tickets")||[]; const t = tickets.find(x=>x.id===ticketId); const user = currentClientUser();
  t.comments.push({ author:user.name, role:"client", text, at:new Date().toISOString() });
  pushTicketHistory(t, `${user.name} added a comment.`);
  if(t.status==="Waiting for Client") t.status="In Progress";
  saveKey("tickets", tickets);
  logAudit("Comment Added","Tickets",`Client replied on ${ticketId}`, t.clientId, null, null, user.id);
  renderClientTicketDetail(ticketId);
}

/* ================= RAISE REQUEST ================= */
function renderClientRaise(){
  document.getElementById("main-content").innerHTML = `
    <div class="topbar"><div><h2>Raise Request</h2><p>Tell us what's going on — we'll route it to the right person</p></div></div>
    <div class="card" style="max-width:640px;">
      <div class="field"><label>Subject *</label><input type="text" id="f-subject" placeholder="Short summary of the issue"></div>
      <div class="field-row"><div class="field"><label>Category</label><select id="f-category">${TICKET_CATEGORIES.map(c=>`<option>${c}</option>`).join("")}</select></div><div class="field"><label>Website / Page URL</label><input type="text" id="f-pageurl" placeholder="optional"></div></div>
      <div class="field"><label>Priority</label><div class="priority-choice">${TICKET_PRIORITIES.map(p=>`<label><input type="radio" name="priority" value="${p}" ${p==="Medium"?"checked":""}><span>${p}</span></label>`).join("")}</div></div>
      <div class="field"><label>Description *</label><textarea id="f-description" placeholder="Describe the issue in detail..."></textarea></div>
      <div class="field"><label>Attachment</label><input type="file" id="f-attachment"><div style="font-size:11.5px;color:var(--muted);margin-top:4px;">Demo only — files aren't actually uploaded yet.</div></div>
      <div class="field"><label>Additional Comments</label><textarea id="f-comments" placeholder="optional"></textarea></div>
      <button class="btn" onclick="submitClientTicket()">Submit Request</button>
    </div>
  `;
}
function submitClientTicket(){
  const subject = document.getElementById("f-subject").value.trim(); const description = document.getElementById("f-description").value.trim();
  if(!subject || !description){ alert("Subject and description are required."); return; }
  const category = document.getElementById("f-category").value;
  const assignedTo = nextAssignee(category);
  const user = currentClientUser(), client = currentClientRecord();
  const tickets = loadKey("tickets")||[];
  const id = "t-"+(1000+tickets.length+1);
  const extra = document.getElementById("f-comments").value.trim();
  const comments = extra ? [{author:user.name, role:"client", text:extra, at:new Date().toISOString()}] : [];
  const record = { id, clientId: client.id, createdBy: user.id, subject, description, category, priority: document.querySelector('input[name="priority"]:checked').value, status:"Assigned", assignedTo, createdAt:new Date().toISOString(), assignedAt:new Date().toISOString(), pageUrl: document.getElementById("f-pageurl").value.trim(), comments, history:[{text:`${client.name} created the ticket.`, at:new Date().toISOString()},{text:`Ticket auto-assigned to ${employeeName(assignedTo)}.`, at:new Date().toISOString()}] };
  tickets.push(record); saveKey("tickets", tickets);
  logAudit("Ticket Created","Tickets", `${id}: "${subject}" from ${client.name}`, client.id, null, null, user.id);
  goToTab("crequests");
  alert(`Request submitted as ${id}. It's been routed to ${employeeName(assignedTo)}.`);
}

/* ================= USERS ================= */
function renderClientUsers(){
  const client = currentClientRecord(), me = currentClientUser();
  if(!me.isAdmin){ document.getElementById("main-content").innerHTML = `<div class="card"><p class="empty-row">Only your Client Admin can manage users.</p></div>`; return; }
  const users = (loadKey("clientUsers")||[]).filter(u=>u.clientId===client.id);
  document.getElementById("main-content").innerHTML = `
    <div class="topbar"><div><h2>Users</h2><p>Manage who from ${escapeHtml(client.name)} can access ${BRAND}</p></div><button class="btn" onclick="openClientUserForm()">+ Add User</button></div>
    <div class="card" style="padding:0;overflow-x:auto;">
      <table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Presence</th><th></th></tr></thead>
      <tbody>${users.map(u=>`<tr><td><b>${escapeHtml(u.name)}</b>${u.isAdmin?` <span class="pill blue">Client Admin</span>`:""}</td><td>${escapeHtml(u.email)}</td><td>${escapeHtml(u.role)}</td><td><span class="pill ${u.active?"green":"red"}">${u.active?"Active":"Deactivated"}</span></td><td>${presenceDot(u.presence)}${escapeHtml(u.presence||"Offline")}</td><td class="row-actions">${u.id===me.id?"<span style=\"color:var(--muted);font-size:12px;\">You</span>":`<button class="icon-btn" onclick="openClientUserForm('${u.id}')">Edit</button><button class="icon-btn" onclick="toggleClientUserActive('${u.id}')">${u.active?"Deactivate":"Activate"}</button><button class="icon-btn" onclick="deleteClientUser('${u.id}')">Remove</button>`}</td></tr>`).join("")}</tbody></table>
    </div>
    <div class="card"><p style="font-size:12.5px;color:var(--muted);margin:0;">There must always be exactly one Client Admin. Removing yourself as admin isn't available in this demo — contact ${BRAND} to transfer admin rights.</p></div>
  `;
}
function roleSelectHtml(currentRole){
  const opts = getRoleOptions();
  const isCustom = currentRole && !opts.includes(currentRole);
  return `
    <select id="f-role-select" onchange="document.getElementById('f-role-custom').style.display=this.value==='__custom__'?'block':'none';">
      ${opts.map(r=>`<option value="${escapeHtml(r)}" ${r===currentRole?"selected":""}>${escapeHtml(r)}</option>`).join("")}
      <option value="__custom__" ${isCustom?"selected":""}>+ Add new role...</option>
    </select>
    <input type="text" id="f-role-custom" placeholder="Type new role name" value="${isCustom?escapeHtml(currentRole):""}" style="display:${isCustom?"block":"none"};margin-top:6px;">
  `;
}
function openClientUserForm(id){
  const users = loadKey("clientUsers")||[]; const item = id ? users.find(u=>u.id===id) : {};
  openModal(`
    <h3>${id?"Edit":"Add"} User</h3>
    <div class="field"><label>Name *</label><input type="text" id="f-name" value="${escapeHtml(item.name||"")}"></div>
    <div class="field"><label>Email *</label><input type="text" id="f-email" value="${escapeHtml(item.email||"")}" ${id?"readonly style=\"background:#f4f5f9;\"":""}></div>
    <div class="field"><label>Role</label>${roleSelectHtml(item.role||"")}</div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveClientUser('${id||""}')">Save</button></div>
  `);
}
function resolveRoleFromForm(){
  let role = document.getElementById("f-role-select").value;
  if(role==="__custom__"){ role = document.getElementById("f-role-custom").value.trim() || "Client User"; addCustomRole(role); }
  return role;
}
function saveClientUser(id){
  const name = document.getElementById("f-name").value.trim();
  if(!name){ alert("Name is required."); return; }
  const client = currentClientRecord();
  const users = loadKey("clientUsers")||[];
  const role = resolveRoleFromForm();
  if(id){
    const u = users.find(x=>x.id===id);
    u.name = name; u.role = role;
    saveKey("clientUsers", users);
    logAudit("Client User Updated","Client Users", `${name}'s details updated`, client.id, null, null, currentClientUser().id);
  } else {
    const email = document.getElementById("f-email").value.trim();
    if(!email){ alert("Email is required."); return; }
    const record = { id: uid(), clientId: client.id, name, email, role, isAdmin:false, active:true, presence:"Active" };
    users.push(record); saveKey("clientUsers", users);
    logAudit("Client User Added","Client Users", `${name} added to ${client.name} (password: demo123)`, client.id, null, null, currentClientUser().id);
  }
  closeModal(); renderClientUsers();
}
function toggleClientUserActive(id){
  const users = loadKey("clientUsers")||[]; const u = users.find(x=>x.id===id); u.active = !u.active; saveKey("clientUsers", users);
  logAudit(u.active?"User Activated":"User Deactivated","Client Users", u.name, u.clientId, null, null, currentClientUser().id);
  renderClientUsers();
}
function deleteClientUser(id){
  const users = loadKey("clientUsers")||[]; const u = users.find(x=>x.id===id);
  if(u.isAdmin){ alert("You can't remove the Client Admin. Transfer admin rights first."); return; }
  if(!confirm(`Remove ${u.name} from this account?`)) return;
  saveKey("clientUsers", users.filter(x=>x.id!==id));
  logAudit("User Removed","Client Users", u.name, u.clientId, null, null, currentClientUser().id);
  renderClientUsers();
}

/* ================= HISTORY ================= */
function renderClientHistory(){
  const client = currentClientRecord(), me = currentClientUser();
  let history = (loadKey("audit")||[]).filter(a=>a.clientId===client.id);
  if(!me.isAdmin){ history = history.filter(a => a.actorUserId===me.id || a.relatedUserId===me.id); }
  history = history.sort((a,b)=>(b.at||"").localeCompare(a.at||""));
  document.getElementById("main-content").innerHTML = `
    <div class="topbar"><div><h2>History</h2><p>${me.isAdmin?"Full activity on your account":"Activity related to you"}</p></div></div>
    <div class="card">${history.length ? history.map(h=>`<div class="history-item"><div class="time">${fmtDateTime(h.at)}</div><div>${escapeHtml(h.summary)}</div></div>`).join("") : `<p class="empty-row">No history yet.</p>`}</div>
  `;
}

  `;
}

  el.innerHTML = `
    <div style="max-width:560px;margin:0 auto;padding:60px 20px;">
      <span class="back-link" onclick="window.location.href=location.pathname">&larr; Back to your account</span>
      <div class="logo-badge" style="margin-bottom:16px;">P</div>

      <div class="card">
        <div style="font-size:30px;font-weight:800;color:var(--accent);margin-bottom:14px;">${fmtMoney(pkg.price)}</div>
        <div style="font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">What's Included</div>
        <ul style="margin:0 0 20px;padding-left:18px;font-size:14px;line-height:2;">${pkg.services.map(s=>`<li>${escapeHtml(s)}</li>`).join("")}</ul>
        <button class="btn" style="width:100%;margin-bottom:10px;" onclick="mockBuyPackage('${pkg.id}','${forClientId||""}')">Buy This Package</button>
        <div style="display:flex;gap:10px;">
          <a class="btn secondary small" style="flex:1;text-align:center;text-decoration:none;box-sizing:border-box;" href="mailto:bhuvanesh@pmsuite.example.com?subject=${encodeURIComponent("Interested in "+pkg.name)}">Connect with Bhuvanesh</a>
          <a class="btn secondary small" style="flex:1;text-align:center;text-decoration:none;box-sizing:border-box;" href="mailto:irfan@pmsuite.example.com?subject=${encodeURIComponent("Interested in "+pkg.name)}">Connect with Irfan</a>
        </div>
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin-top:16px;">Use the link above, or just close this tab, to return to your account anytime.</p>

function mockBuyPackage(pkgId, clientId){
  const pkg = PACKAGE_CATALOG.find(p=>p.id===pkgId);

  alert("Thanks! This is a demo — in the live version this would start checkout. Our team will reach out to confirm.");
}

/* ---------------- Init / routing ---------------- */
restoreRedirectedPath();
seedIfEmpty();
const _urlParams = new URLSearchParams(window.location.search);
if(_urlParams.get("viewPackage")){
  populateDemoHint();
  renderPackageLandingPage(_urlParams.get("viewPackage"), _urlParams.get("forClient"));
} else if(getSession()){
  const sessionUser = currentClientUser();
  if(sessionUser){ try{ history.replaceState(null, "", urlForUser(sessionUser)); }catch(e){} }
  showApp();
} else {
  applyLoginScreenForRoute(resolveRoute());
}
</script>
