<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Portal (Demo) — Project Management Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600&family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Quicksand:wght@500;700&family=Poppins:wght@400;600&family=DM+Serif+Display&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#f5f6fa; --card:#ffffff; --border:#e5e7f0; --text:#181a2e; --muted:#686d84;
    --sidebar:#121324; --sidebar-text:#b4b8d1; --sidebar-active:#23253f;
    --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef0fe;
    --danger:#dc2626; --danger-soft:#fdecec; --success:#16a34a; --success-soft:#e8f8ee;
    --warn:#b45309; --warn-soft:#fdf1de;
    --radius:12px;
    --shadow-sm:0 1px 2px rgba(15,15,40,.05), 0 1px 1px rgba(15,15,40,.04);
    --shadow-md:0 8px 24px rgba(15,15,40,.08), 0 2px 6px rgba(15,15,40,.05);
    --shadow-lg:0 24px 60px rgba(15,15,40,.16);
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;color:var(--text);}
  input,select,textarea{font-family:inherit;color:var(--text);}

  #demo-banner{background:#1d2030;color:#fff;font-size:12.5px;padding:7px 16px;text-align:center;}
  #demo-banner b{color:#ffcf70;}

  #login-screen{min-height:calc(100vh - 34px);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#171a2b,#2a2f6a);padding:16px;}
  .login-box{background:var(--card);padding:40px 36px;border-radius:16px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center;}
  .logo-badge{width:56px;height:56px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;margin:0 auto 14px;}
  .login-box h1{font-size:20px;margin:0 0 4px;}
  .login-box p.sub{color:var(--muted);font-size:13px;margin:0 0 22px;}
  .login-box input{width:100%;padding:11px 12px;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;}
  .login-box button{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;margin-top:6px;}
  .login-box button:hover{background:var(--accent-hover);}
  #login-error{color:var(--danger);font-size:12.5px;min-height:18px;margin-top:2px;}
  .demo-hint{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:9px 12px;font-size:11.5px;margin-top:10px;text-align:left;line-height:1.6;max-height:150px;overflow-y:auto;}
  .demo-hint b{display:block;margin:6px 0 2px;}
  .demo-hint b:first-child{margin-top:0;}

  #app{display:none;min-height:100vh;}
  .shell{display:flex;min-height:calc(100vh - 34px);}
  .sidebar{width:226px;background:var(--sidebar);color:var(--sidebar-text);flex-shrink:0;display:flex;flex-direction:column;padding:18px 13px;box-shadow:2px 0 12px rgba(0,0,0,.15);position:relative;z-index:2;}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
  .sidebar .brand .logo-badge{width:34px;height:34px;font-size:16px;border-radius:10px;margin:0;box-shadow:0 4px 10px rgba(79,70,229,.4);}
  .sidebar .brand b{color:#fff;font-size:15px;letter-spacing:-.01em;}
  .sidebar .brand span{display:block;font-size:10.5px;color:#8286a3;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--sidebar-text);font-size:13.3px;font-weight:500;cursor:pointer;margin-bottom:2px;user-select:none;text-decoration:none;transition:background .12s ease,color .12s ease;}
  .nav-item:hover{background:#1d1f38;color:#fff;}
  .nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
  .nav-item .ic{width:18px;text-align:center;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;}
  .nav-item .ic svg{width:16px;height:16px;}

  .sidebar-org{background:#1a1c33;border-radius:9px;padding:10px 11px;margin-bottom:10px;font-size:12px;border:1px solid #262a44;}
  .sidebar-org b{display:block;color:#fff;font-size:13px;}

  .sidebar-footer{margin-top:auto;padding-top:8px;border-top:1px solid #262a44;}
  .sidebar-footer button{width:100%;padding:9px;background:#1e2038;color:#fff;border:1px solid #2c2f4d;border-radius:8px;font-size:12.5px;font-weight:500;transition:background .12s ease;}
  .sidebar-footer button:hover{background:#282b48;}

  .main{flex:1;padding:28px 34px;overflow-y:auto;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
  .topbar h2{margin:0 0 3px;font-size:21px;font-weight:700;letter-spacing:-.01em;}
  .topbar p{margin:0;color:var(--muted);font-size:13px;}
  .btn{padding:9px 16px;border-radius:9px;border:none;font-size:13.5px;font-weight:600;background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(79,70,229,.15), 0 2px 8px rgba(79,70,229,.18);transition:background .12s ease,box-shadow .12s ease,transform .12s ease;}
  .btn:hover{background:var(--accent-hover);box-shadow:0 2px 4px rgba(79,70,229,.2), 0 4px 14px rgba(79,70,229,.25);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow-sm);}
  .btn.secondary:hover{background:#f7f8fb;border-color:#d3d6e3;}
  .btn.small{padding:6px 11px;font-size:12px;border-radius:7px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);transition:transform .15s ease,box-shadow .15s ease;}
  .stat-card .label{font-size:11.5px;color:var(--muted);margin-bottom:7px;font-weight:500;}
  .stat-card .value{font-size:22px;font-weight:800;letter-spacing:-.01em;}
  .stat-card .value.small{font-size:16px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
  .card h3{margin:0 0 14px;font-size:14.5px;font-weight:700;letter-spacing:-.005em;}
  .two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  @media (max-width:900px){ .two-col{grid-template-columns:1fr;} }

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--border);background:#fafaff;}
  td{padding:11px 10px;border-bottom:1px solid #f0f1f6;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr.clickable{transition:background .1s ease;}
  tr.clickable:hover{background:#f8f9fc;cursor:pointer;}
  .empty-row{text-align:center;color:var(--muted);padding:30px !important;}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .pill.gray{background:#eef0f5;color:#555a72;}
  .pill.green{background:var(--success-soft);color:var(--success);}
  .pill.red{background:var(--danger-soft);color:var(--danger);}
  .pill.blue{background:var(--accent-soft);color:var(--accent);}
  .pill.yellow{background:#fef6e0;color:#a5720b;}
  .pill.orange{background:var(--warn-soft);color:var(--warn);}
  .mono{font-family:ui-monospace,Consolas,monospace;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{border:1px solid var(--border);background:#fff;border-radius:7px;padding:5px 8px;font-size:12px;transition:background .12s ease,border-color .12s ease;}
  .icon-btn:hover{background:#f0f1f6;}

  .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}

  .comment{display:flex;gap:10px;margin-bottom:14px;}
  .comment .bubble{background:#f5f6fa;border-radius:10px;padding:9px 12px;flex:1;}
  .comment.mine .bubble{background:var(--accent-soft);}
  .comment .meta{font-size:11.5px;color:var(--muted);margin-bottom:3px;}
  .comment .meta b{color:var(--text);}
  .comment .text{font-size:13px;line-height:1.5;white-space:pre-wrap;}

  .history-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f0f1f5;font-size:12.5px;}
  .history-item:last-child{border-bottom:none;}
  .history-item .time{color:var(--muted);white-space:nowrap;min-width:120px;}

  .priority-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px;}
  .priority-card{border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;border:1px solid transparent;transition:transform .15s ease;}
  .priority-card .num{font-size:26px;font-weight:800;}
  .priority-card .lbl{font-size:12px;font-weight:600;margin-top:2px;}
  .priority-card:hover{border-color:currentColor;transform:translateY(-2px);}
  .priority-card.Urgent{background:var(--danger-soft);color:var(--danger);}
  .priority-card.High{background:var(--warn-soft);color:var(--warn);}
  .priority-card.Medium{background:var(--accent-soft);color:var(--accent);}
  .priority-card.Low{background:#eef0f5;color:#555a72;}
  .priority-card.active{outline:2px solid currentColor;}

  .overlay{position:fixed;inset:0;background:rgba(15,17,32,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:26px 28px;box-shadow:var(--shadow-lg);}
  .modal h3{margin:0 0 16px;font-size:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:#464a5c;margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .priority-choice{display:flex;gap:8px;}
  .priority-choice label{flex:1;text-align:center;padding:9px 4px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);}
  .priority-choice input{display:none;}
  .priority-choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}

  .back-link{font-size:12.5px;color:var(--accent);cursor:pointer;margin-bottom:10px;display:inline-block;}
  .status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--success);margin-right:6px;}

  ::placeholder{color:#a7abbd;}

  .presence-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;position:relative;top:-1px;}
  .presence-dot.glow{animation:presencePulse 2s infinite;}
  @keyframes presencePulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.55);}70%{box-shadow:0 0 0 7px rgba(22,163,74,0);}100%{box-shadow:0 0 0 0 rgba(22,163,74,0);}}
  .presence-select{background:#171a2b;color:#fff;border:1px solid #33375a;border-radius:6px;padding:5px 6px;font-size:11.5px;width:100%;}

  #package-landing{display:none;background:var(--bg);min-height:100vh;}
  .other-pkg-card{cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;}
  .other-pkg-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(24,30,60,.08);border-color:var(--accent);}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .fade-in{animation:fadeInUp .35s ease-out both;}
  @media (prefers-reduced-motion: reduce){ .fade-in{animation:none;} }

  .checkbox-group{display:flex;flex-wrap:wrap;gap:10px;}
  .checkbox-group label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:7px;}
  .wm-shell{display:flex;align-items:stretch;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden;}
  .wm-nav{width:232px;flex-shrink:0;position:sticky;top:0;align-self:flex-start;background:#f5f6fb;border-right:1px solid var(--border);padding:18px 12px;}
  .wm-nav-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 10px;margin:16px 0 6px;}
  .wm-nav-label:first-child{margin-top:0;}
  .wm-nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text);text-decoration:none;cursor:pointer;margin-bottom:2px;transition:background .12s ease,color .12s ease,transform .12s ease;}
  .wm-nav-item:hover{background:#e8eaf5;color:var(--accent);transform:translateX(1px);}
  .wm-nav-item.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.3);}
  .wm-nav-item.active:hover{background:var(--accent-hover);color:#fff;transform:none;}
  .wm-nav-item .ic{width:18px;text-align:center;font-size:14px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;}
  .wm-nav-item .ic svg{width:16px;height:16px;}
  .wm-content{flex:1;min-width:0;background:#fff;padding:26px 30px;}

  /* Dark mode — scoped entirely to .wm-shell.wm-dark. Redefines the same design
     tokens (--card,--border,--text,--muted,etc.) used everywhere else in Manage
     Website, so every existing rule and inline style picks up dark values
     automatically inside this panel — nothing outside it is touched. */
  .wm-shell.wm-dark{
    --card:#1f2130; --border:rgba(255,255,255,.11); --text:#eef0fb; --muted:#9498b0;
    --accent-soft:rgba(124,117,255,.20);
    --success-soft:rgba(22,163,74,.22); --danger-soft:rgba(220,38,38,.22); --warn-soft:rgba(217,138,15,.24);
    background:#15161f; border-color:rgba(255,255,255,.10);
  }
  .wm-shell.wm-dark .wm-nav{background:#101018;border-right-color:rgba(255,255,255,.10);}
  .wm-shell.wm-dark .wm-content{background:#181a26;color:var(--text);}
  .wm-shell.wm-dark .wm-nav-label{color:#6e7290;}
  .wm-shell.wm-dark .wm-nav-item{color:#e2e4f6;}
  .wm-shell.wm-dark .wm-nav-item:hover{background:#242640;color:#b6b0ff;}
  .wm-shell.wm-dark .wm-nav-item.active{background:var(--accent);color:#fff;}
  .wm-shell.wm-dark .wm-section-head h3{color:var(--text);}
  .wm-shell.wm-dark .wm-section-head p{color:var(--muted);}
  .wm-shell.wm-dark table th{background:#14151f;color:var(--muted);border-bottom-color:var(--border);}
  .wm-shell.wm-dark table td{border-bottom-color:rgba(255,255,255,.07);color:var(--text);}
  .wm-shell.wm-dark tr.clickable:hover{background:#20223a;}
  .wm-shell.wm-dark .card{box-shadow:none;}
  .wm-shell.wm-dark .card h3{color:var(--text);}
  .wm-shell.wm-dark .field label{color:#c7cae2;}
  .wm-shell.wm-dark .field input,.wm-shell.wm-dark .field select,.wm-shell.wm-dark .field textarea{background:#14151f;color:var(--text);border-color:rgba(255,255,255,.16);}
  .wm-shell.wm-dark .field input::placeholder,.wm-shell.wm-dark .field textarea::placeholder{color:#565a75;}
  .wm-shell.wm-dark .btn.secondary{background:#262840;border-color:rgba(255,255,255,.16);color:var(--text);}
  .wm-shell.wm-dark .btn.secondary:hover{background:#30324f;}
  .wm-shell.wm-dark .icon-btn{background:#262840;border-color:rgba(255,255,255,.16);color:var(--text);}
  .wm-shell.wm-dark .icon-btn:hover{background:#30324f;}
  .wm-shell.wm-dark .wm-photo-thumb{background:#242640;color:var(--muted);}
  .wm-shell.wm-dark .empty-row{color:var(--muted);}
  .wm-shell.wm-dark .wm-counter{color:#7a7ea0;}
  .wm-shell.wm-dark .checkbox-group label{background:#20223a;border-color:rgba(255,255,255,.16);color:var(--text);}
  .wm-shell.wm-dark .mono{color:var(--text);}
  .wm-shell.wm-dark .wm-banner-preview.off{background:#20223a;color:var(--muted);}
  .wm-shell.wm-dark .pill.gray{background:#2a2c46;color:#c7cae2;}
  .wm-section-head{margin-bottom:18px;}
  .wm-section-head h3{margin:0 0 4px;font-size:17px;}
  .wm-section-head p{margin:0;color:var(--muted);font-size:13px;}
  .wm-photo-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;position:relative;}
  .wm-photo-thumb{width:100%;height:130px;border-radius:8px;background:#eef0f5;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;margin-bottom:8px;text-align:center;}
  .wm-select{position:absolute;top:10px;right:10px;}
  .wm-save-msg{font-size:12px;color:var(--success);margin-top:8px;min-height:16px;}
  .wm-hint{font-size:12px;color:var(--muted);margin:-4px 0 14px;line-height:1.6;}
  .wm-field-error{font-size:11.5px;color:var(--danger);margin-top:-8px;margin-bottom:12px;min-height:14px;}
  .wm-field-error:empty{display:none;}
  .field.has-error input,.field.has-error textarea,.field.has-error select{border-color:var(--danger);background:var(--danger-soft);}
  .wm-counter{font-size:11px;color:var(--muted);text-align:right;margin-top:-8px;margin-bottom:10px;}
  .wm-counter.over{color:var(--danger);font-weight:600;}
  .wm-toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .wm-toast{background:var(--dark);color:#fff;padding:12px 16px;border-radius:9px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:340px;display:flex;align-items:center;gap:10px;animation:wmToastIn .2s ease;}
  .wm-toast.error{background:var(--danger);}
  @keyframes wmToastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .wm-section-toggle-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:6px;}
  .wm-section-toggle{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:12.5px;}
  .wm-section-toggle b{display:block;font-size:12.5px;}
  .wm-section-toggle span{display:block;color:var(--muted);font-size:11px;margin-top:1px;line-height:1.4;}
  .wm-banner-preview{background:linear-gradient(135deg,#171a2b,#2a2f6a);color:#fff;padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;}
  .wm-banner-preview.off{background:#eef0f5;color:var(--muted);}
  .wm-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:6px;position:relative;top:-1px;}
  .wm-pending-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--warn-soft);border:1px solid #f0dca8;color:#8a5c00;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:18px;flex-wrap:wrap;}
  .wm-preview-section{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
  .wm-preview-section-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f7f8fc;border-bottom:1px solid var(--border);}
  .wm-preview-section-head b{font-size:13.5px;}
  .wm-preview-body{padding:14px 16px;font-size:13px;line-height:1.7;}
  .wm-preview-body table{width:100%;}
  .wm-changed-badge{background:var(--warn-soft);color:#8a5c00;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .wm-site-preview{
    --site-bg:#f7f8fc; --site-surface:#fff; --site-surface2:#eef0f5; --site-ink:#1d2030; --site-muted:#6b7080;
    --site-accent:#4f46e5; --site-accent-ink:#fff; --site-border:#e3e5ec; --site-radius:14px;

  .mobile-topbar{display:none;}

/* ================= URL ROUTING (client/user pretty paths) ================= */
const REPO_SEGMENT = "Project-Management-Suite";
function slugify(s){ return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-+|-+$)/g,""); }
function clientSlug(client){ return slugify(client.name); }
function userSlugForClient(user){ return slugify((user.name||"").split(" ")[0]) || slugify(user.name) || user.id; }
function findClientBySlug(slug){ return (loadKey("clients")||[]).find(c => clientSlug(c) === slug); }
function findClientUserBySlug(client, slug){ return (loadKey("clientUsers")||[]).filter(u=>u.clientId===client.id).find(u => userSlugForClient(u) === slug); }
function basePath(){
  const parts = location.pathname.split("/").filter(Boolean);
  if(parts[0] && parts[0].toLowerCase() === REPO_SEGMENT.toLowerCase()) return "/" + parts[0];
  return "";
}
function routeSlugFromPath(pathname){
  let parts = pathname.split("/").filter(Boolean);
  if(parts[0] && parts[0].toLowerCase() === REPO_SEGMENT.toLowerCase()) parts = parts.slice(1);
  if(!parts.length) return null;
  const first = parts[0].replace(/\.html$/i,"");
  if(first === "portal" || first === "index" || first === "") return null;
  return first;
}
function restoreRedirectedPath(){
  let redirected;
  try{ redirected = sessionStorage.getItem("pms_redirect"); }catch(e){ redirected = null; }
  if(redirected){
    try{ sessionStorage.removeItem("pms_redirect"); }catch(e){}
    try{ history.replaceState(null, "", redirected); }catch(e){}
  }
}
function resolveRoute(){
  const slug = routeSlugFromPath(location.pathname);
  if(!slug || slug.toLowerCase() === "demo") return { type:"demo" };
  const underscoreIdx = slug.lastIndexOf("_");
  if(underscoreIdx > 0){
    const cSlug = slug.slice(0, underscoreIdx), uSlug = slug.slice(underscoreIdx+1);
    const client = findClientBySlug(cSlug);
    const user = client ? findClientUserBySlug(client, uSlug) : null;
    if(client && user) return { type:"client-user", client, user };
    if(client) return { type:"client", client };
    return { type:"demo" };
  }
  const client = findClientBySlug(slug);
  return client ? { type:"client", client } : { type:"demo" };
}
function urlForUser(user){
  const client = (loadKey("clients")||[]).find(c=>c.id===user.clientId);
  return `${basePath()}/${clientSlug(client)}_${userSlugForClient(user)}`;
}
function urlForClient(client){ return `${basePath()}/${clientSlug(client)}`; }
function urlForDemo(){ return `${basePath()}/demo`; }

let currentTab = "cdashboard";

let isRestoringHistory = false;
function pushHistoryState(){
  if(isRestoringHistory) return;
  if(!getSession()) return;
  const state = { tab: currentTab, ticketId: currentTicketId, dashViewAsUserId };
  try{ history.pushState(state, ""); }catch(e){}
}
window.addEventListener("popstate", (e) => {
  if(!getSession()) return;
  isRestoringHistory = true;
  const st = e.state || { tab: "cdashboard" };
  currentTab = st.tab; currentTicketId = st.ticketId||null; dashViewAsUserId = st.dashViewAsUserId||null;
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.tab===currentTab));
  render();
  isRestoringHistory = false;
});
/* React to a genuine hash change the app didn't make itself — an address-bar edit, a
   fragment link into an already-open tab, or a deep link that arrives via the 404.html
   redirect (portal.html can load a beat before the restored hash lands). syncHash() uses
   replaceState, so it never triggers this. */
window.addEventListener("hashchange", () => {
  if(!getSession() || isRestoringHistory) return;
  const tab = applyHashRoute();
  if(!tab || tab === currentTab) return;
  isRestoringHistory = true;
  goToTab(tab);
  isRestoringHistory = false;
});

function goToTab(tab){
  currentTab = tab; currentTicketId=null; currentPriorityFilter=null;
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.tab===tab || (tab==="cwebsite-manage" && n.dataset.tab==="cwebsite")));
  render();
  syncHash();
  pushHistoryState();
  closeNav();
}

  let wrap = document.getElementById("wm-toast-wrap");
  if(!wrap){ wrap = document.createElement("div"); wrap.id = "wm-toast-wrap"; wrap.className = "wm-toast-wrap"; document.body.appendChild(wrap); }

const EMPTY_WEBSITE_CONTENT = { text:{}, photos:[], menu:[], offers:[], hours:[], contact:{}, testimonials:[], faqs:[], banner:{}, seo:{} };
function websiteRecordFor(clientId){
  seedWebsiteContentIfEmpty();
  const all = loadKey("websiteContent")||{};
  if(!all[clientId]) all[clientId] = { published: JSON.parse(JSON.stringify(EMPTY_WEBSITE_CONTENT)), draft: JSON.parse(JSON.stringify(EMPTY_WEBSITE_CONTENT)) };
  return all[clientId];
}
/* The DRAFT copy — every Manage Website edit reads and writes here, never touching what's published. */
function currentClientWebsiteContent(){
  return websiteRecordFor(currentClientRecord().id).draft;
}
function saveClientWebsiteContent(content){
  const client = currentClientRecord();
  const all = loadKey("websiteContent")||{};
  all[client.id].draft = content;
  saveKey("websiteContent", all);
}
function currentClientWebsitePublished(){
  return websiteRecordFor(currentClientRecord().id).published;
}
function websiteHasPendingChanges(clientId){
  const rec = websiteRecordFor(clientId);
  return JSON.stringify(rec.draft) !== JSON.stringify(rec.published);
}
function sectionHasPendingChanges(clientId, sectionId){
  const rec = websiteRecordFor(clientId);
  return JSON.stringify(rec.draft[sectionId]) !== JSON.stringify(rec.published[sectionId]);
}
function publishWebsiteDraft(){
  const client = currentClientRecord();
  const all = loadKey("websiteContent")||{};
  all[client.id].published = JSON.parse(JSON.stringify(all[client.id].draft));
  saveKey("websiteContent", all);
  logAudit("Website Published","Website","Draft changes published to the live site", client.id, null, null, currentClientUser().id);
  wmToast("Published ✓ — once your database is connected, this is what visitors will see.");
}
function discardWebsiteDraft(){
  if(!confirm("Discard all unpublished changes and revert to what's currently live? This can't be undone.")) return;
  const client = currentClientRecord();
  const all = loadKey("websiteContent")||{};
  all[client.id].draft = JSON.parse(JSON.stringify(all[client.id].published));
  saveKey("websiteContent", all);
  logAudit("Draft Discarded","Website","Unpublished changes discarded", client.id, null, null, currentClientUser().id);
  wmToast("Draft discarded — back to the published version.");
  renderManageWebsite();
}
function myWebsiteAccessSections(){
  const me = currentClientUser();
  if(me.isAdmin) return WEBSITE_SECTIONS.map(s=>s.id);
  return me.websiteAccess || [];
}
function clientEnabledSections(client){
  return client.websiteSections || WEBSITE_SECTIONS.map(s=>s.id);
}
function flashSaved(){ wmToast("Saved ✓ — showing here now. Once your database is connected, this publishes straight to the live site."); }

/* ---- Hash routing: keeps the address bar in sync so Ctrl/Cmd/middle-click on any
   nav item opens that exact tab in a new tab (sessionStorage carries over to it). ---- */
function navClick(e, tab){
  if(e.ctrlKey || e.metaKey || e.shiftKey || e.button===1) return true;
  e.preventDefault(); goToTab(tab); return false;
}
function wmNavClick(e, section){
  if(e.ctrlKey || e.metaKey || e.shiftKey || e.button===1) return true;
  e.preventDefault(); goToWebsiteSection(section); return false;
}
function syncHash(){
  const hash = currentTab==="cwebsite-manage" ? `#/cwebsite-manage/${websiteMgmtSection}` : `#/${currentTab}`;
  if(location.hash!==hash){ try{ history.replaceState(history.state, "", location.pathname+location.search+hash); }catch(e){} }
}
function applyHashRoute(){
  const h = location.hash.replace(/^#\/?/, "");
  if(!h) return null;
  const parts = h.split("/");
  if(parts[0]==="cwebsite-manage"){ if(parts[1]) websiteMgmtSection = parts[1]; return "cwebsite-manage"; }
  return parts[0] || null;
}

function wmDarkModeOn(){ return localStorage.getItem("pmsdemo_wmDark")==="1"; }
function toggleWmDarkMode(){
  localStorage.setItem("pmsdemo_wmDark", wmDarkModeOn() ? "0" : "1");
  /* Full re-render (not a classList patch on existing nodes) — toggling the class
     on already-rendered elements left some of them stuck on their pre-toggle color
     until the next repaint trigger. Fresh nodes always compute their style correctly. */
  renderManageWebsite();
}

    document.getElementById("main-content").innerHTML = `
      <div class="topbar"><div><h2>Manage Website</h2><p>${escapeHtml(client.name)}</p></div><button class="btn secondary" onclick="goToTab('cwebsite')">&larr; Website Overview</button></div>

  }).join("")
    + `<div class="wm-nav-label">Review</div><a href="#/cwebsite-manage/preview" class="wm-nav-item ${websiteMgmtSection==="preview"?"active":""}" onclick="return wmNavClick(event,'preview')"><span class="ic">${ICONS.eye}</span> Preview${pending?` <span class="wm-dot" title="Unpublished changes"></span>`:""}</a>`
    + (me.isAdmin ? `<div class="wm-nav-label">Admin</div><a href="#/cwebsite-manage/access" class="wm-nav-item ${websiteMgmtSection==="access"?"active":""}" onclick="return wmNavClick(event,'access')"><span class="ic">${ICONS.lock}</span> Access</a><a href="#/cwebsite" class="wm-nav-item" onclick="return navClick(event,'cwebsite')"><span class="ic">${ICONS.back}</span> Website Overview</a>` : "");
  document.getElementById("main-content").innerHTML = `

function resizeImageFile(file, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale; canvas.height = img.height * scale;
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  const photos = currentClientWebsiteContent().photos||[];

    <div class="field"><label>Caption</label><input type="text" id="wm-photo-caption" value="${escapeHtml(item.caption||"")}"></div>

    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="savePhoto('${id||""}')">Save</button></div>
  `);
  window._wmPhotoUrl = item.url || "";

    resizeImageFile(file, dataUrl => {
      window._wmPhotoUrl = dataUrl;

    });
  });
}

   Preview looks like a real bakery/auto-shop/cafe/clinic/gift-shop/school site, not one
   generic admin-purple template reused for everyone. */
const CLIENT_BRAND_THEMES = {
  "c-pavmantra": { bg:"#fdf9f3", surface:"#ffffff", surface2:"#f6ead9", ink:"#2b1d12", muted:"#8a7460", accent:"#b5651d", accentInk:"#ffffff", border:"#efe1cc", radius:"10px", fontDisplay:"'Fraunces',serif", fontBody:"'Nunito Sans',sans-serif" },

  "c-hangout": { bg:"#fbf6ec", surface:"#ffffff", surface2:"#eef2df", ink:"#26311f", muted:"#647055", accent:"#7a8f3f", accentInk:"#ffffff", border:"#e6ead8", radius:"14px", fontDisplay:"'Quicksand',sans-serif", fontBody:"'Quicksand',sans-serif" },
  "c-srima": { bg:"#f2f7f6", surface:"#ffffff", surface2:"#dcece8", ink:"#132621", muted:"#4c635d", accent:"#0f7a68", accentInk:"#ffffff", border:"#d7e5e1", radius:"10px", fontDisplay:"'Poppins',sans-serif", fontBody:"'Poppins',sans-serif" },
  "c-sriram": { bg:"#fdf8f1", surface:"#fffaf3", surface2:"#f1e0c2", ink:"#2e1a0f", muted:"#7a6650", accent:"#a8791f", accentInk:"#ffffff", border:"#ecdfc2", radius:"6px", fontDisplay:"'DM Serif Display',serif", fontBody:"'Karla',sans-serif" },
  "c-shibpur": { bg:"#f4f6fb", surface:"#ffffff", surface2:"#e6eaf5", ink:"#1a2140", muted:"#565f7d", accent:"#2c3e8c", accentInk:"#ffffff", border:"#dee2ee", radius:"8px", fontDisplay:"'Fraunces',serif", fontBody:"'Nunito Sans',sans-serif" }
};
const DEFAULT_BRAND_THEME = { bg:"#f7f8fc", surface:"#ffffff", surface2:"#eef0f5", ink:"#1d2030", muted:"#6b7080", accent:"#4f46e5", accentInk:"#ffffff", border:"#e3e5ec", radius:"14px", fontDisplay:"inherit", fontBody:"inherit" };
function clientBrandTheme(clientId){ return CLIENT_BRAND_THEMES[clientId] || DEFAULT_BRAND_THEME; }
function brandThemeStyle(theme){
  return `--site-bg:${theme.bg};--site-surface:${theme.surface};--site-surface2:${theme.surface2};--site-ink:${theme.ink};--site-muted:${theme.muted};--site-accent:${theme.accent};--site-accent-ink:${theme.accentInk};--site-border:${theme.border};--site-radius:${theme.radius};--site-font-display:${theme.fontDisplay};--site-font-body:${theme.fontBody};`;
}
function wmSitePreviewSection(id, label, innerHtml, draft, published){
  const changed = JSON.stringify(draft[id]) !== JSON.stringify(published[id]);
  return `<div class="wm-site-section ${changed?"updated":""}"><h2>${escapeHtml(label)}${changed?`<span class="wm-changed-badge">Updated</span>`:""}</h2>${innerHtml}</div>`;
}
function renderWmSitePreview(client, draft, published, enabled){
  const t = draft.text||{}, b = draft.banner||{};
  const theme = clientBrandTheme(client.id);
  let html = `<div class="wm-site-preview" style="${brandThemeStyle(theme)}"><div class="wm-site-brand-tag"><span class="wm-site-brand-dot"></span>Rendered in ${escapeHtml(client.name)}'s own site colors &amp; fonts, pulled from ${escapeHtml(client.website)}</div>`;
  if(enabled.includes("banner") && b.enabled && b.text){
    html += `<div class="wm-site-banner">${escapeHtml(b.text)}${b.linkLabel?(" — "+escapeHtml(b.linkLabel)):""}</div>`;
  }
  html += `<div class="wm-site-hero"><h1>${escapeHtml(t.heroTitle||client.name)}</h1><p>${escapeHtml(t.heroSubtitle||"")}</p></div>`;
  if(enabled.includes("text") && (t.aboutTitle||t.aboutBody)){
    html += wmSitePreviewSection("text","About", `<b>${escapeHtml(t.aboutTitle||"")}</b><p style="font-size:13px;color:var(--muted);">${escapeHtml(t.aboutBody||"")}</p>`, draft, published);
  }
  if(enabled.includes("photos")){
    const photos = draft.photos||[];
    const inner = photos.length ? `<div class="wm-site-gallery">${photos.map(p=>`<div class="wm-site-photo" style="${p.url?`background-image:url('${p.url}');`:""}">${p.url?"":escapeHtml(p.caption||"Photo")}</div>`).join("")}</div>` : `<p style="font-size:13px;color:var(--muted);">No photos yet.</p>`;
    html += wmSitePreviewSection("photos","Photos", inner, draft, published);
  }
  if(enabled.includes("menu")){
    const menu = draft.menu||[];
    const inner = menu.length ? menu.map(c=>`<div class="wm-site-menu-cat"><h4>${escapeHtml(c.name)}</h4>${c.items.map(it=>`<div class="wm-site-menu-item"><span>${escapeHtml(it.name)}</span><span>${it.price!=null?("₹"+it.price):"Enquire"}</span></div>`).join("")}</div>`).join("") : `<p style="font-size:13px;color:var(--muted);">No menu yet.</p>`;
    html += wmSitePreviewSection("menu","Menu & Prices", inner, draft, published);
  }
  if(enabled.includes("offers")){
    const offers = (draft.offers||[]).filter(o=>o.active);
    const inner = offers.length ? offers.map(o=>`<div class="wm-site-offer-card"><b>${escapeHtml(o.title)}</b><br>${escapeHtml(o.description||"")}</div>`).join("") : `<p style="font-size:13px;color:var(--muted);">No active offers.</p>`;
    html += wmSitePreviewSection("offers","Offers", inner, draft, published);
  }
  if(enabled.includes("testimonials")){
    const items = draft.testimonials||[];
    const inner = items.length ? items.map(x=>`<div class="wm-site-testimonial">&ldquo;${escapeHtml(x.quote)}&rdquo;<br><b style="font-size:12px;">— ${escapeHtml(x.author)}</b></div>`).join("") : `<p style="font-size:13px;color:var(--muted);">No testimonials yet.</p>`;
    html += wmSitePreviewSection("testimonials","Testimonials", inner, draft, published);
  }
  if(enabled.includes("faqs")){
    const items = draft.faqs||[];
    const inner = items.length ? items.map(x=>`<div class="wm-site-faq"><b>${escapeHtml(x.question)}</b><span style="font-size:13px;color:var(--muted);">${escapeHtml(x.answer)}</span></div>`).join("") : `<p style="font-size:13px;color:var(--muted);">No FAQs yet.</p>`;
    html += wmSitePreviewSection("faqs","FAQs", inner, draft, published);
  }
  if(enabled.includes("hours")){
    const rows = draft.hours||[];
    const inner = rows.length ? rows.map(h=>`<div class="wm-site-hours-row"><span><b>${escapeHtml(h.label)}</b><br><span style="color:var(--muted);">${escapeHtml(h.address||"")}</span></span><span>${escapeHtml(h.open||"—")} – ${escapeHtml(h.close||"—")}</span></div>`).join("") : `<p style="font-size:13px;color:var(--muted);">No hours listed.</p>`;
    html += wmSitePreviewSection("hours","Hours & Locations", inner, draft, published);
  }
  if(enabled.includes("contact")){
    const c = draft.contact||{};
    const bits = [c.phone&&("Phone: "+escapeHtml(c.phone)), c.whatsapp&&("WhatsApp: "+escapeHtml(c.whatsapp)), c.email&&("Email: "+escapeHtml(c.email)), c.instagram&&("Instagram: "+escapeHtml(c.instagram))].filter(Boolean).join("<br>") || `<span style="color:var(--muted);">No contact details set.</span>`;

        ${pkg.custom ? "" : `<button class="btn" style="width:100%;margin-bottom:10px;" onclick="mockBuyPackage('${pkg.id}','${forClientId||""}')">Buy This Package</button>`}
        <div style="display:flex;gap:10px;">
          <a class="btn ${pkg.custom?"":"secondary"} small" style="flex:1;text-align:center;text-decoration:none;box-sizing:border-box;" href="mailto:hello@thikaana.co?subject=${encodeURIComponent((pkg.custom?"Let's discuss requirements — ":"Interested in ")+pkg.name)}">${pkg.custom?"Let's Discuss Your Requirements":"Connect with Us"}</a>
        </div>
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin-top:16px;">Use the link above, or just close this tab, to return to your account anytime.</p>
    </div>
  `;
  animateIn("#package-landing");
}
function mockBuyPackage(pkgId, clientId){
  const pkg = PACKAGE_CATALOG.find(p=>p.id===pkgId);
  logAudit("Package Interest","Packages", `Interested in upgrading to ${pkg.name}`, clientId||null);
  alert("Thanks! This is a demo — in the live version this would start checkout. Our team will reach out to confirm.");
}

/* ---------------- Init / routing ---------------- */
restoreRedirectedPath();
seedIfEmpty();
const _urlParams = new URLSearchParams(window.location.search);
const _route = resolveRoute();
if(_urlParams.get("viewPackage")){
  populateDemoHint();
  renderPackageLandingPage(_urlParams.get("viewPackage"), _urlParams.get("forClient"));
} else if(getSession() && _route.type !== "demo"){
  /* Only auto-resume a stored session when the URL already points at a specific
     client/user. A bare /portal.html, /index or /demo URL is a prospect landing —
     always show the login screen there, even if a stale session is in localStorage. */
  const initialTab = applyHashRoute();
  const sessionUser = currentClientUser();
  if(sessionUser){ try{ history.replaceState(null, "", urlForUser(sessionUser) + location.hash); }catch(e){} }
  showApp(initialTab);
} else {
  applyLoginScreenForRoute(_route);
}
</script>
