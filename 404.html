<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Management Suite</title>
<script>
  /* GitHub Pages has no server-side routing — this file is what Pages serves for any
     path it doesn't recognize (e.g. /Project-Management-Suite/demo). It stashes the
     requested path and hands off to portal.html, which restores it via replaceState. */
  try{ sessionStorage.setItem("pms_redirect", location.pathname + location.search + location.hash); }catch(e){}
  /* The "/Project-Management-Suite" path prefix only exists on the raw
     github.io project-page URL — there the files really do live under that
     subpath, so it must be kept in the redirect target. On the custom domain
     (portal.thikaana.co) the files live at the domain root; "/PMS" there is
     a purely cosmetic vanity prefix (restored to the address bar afterwards
     via pms_redirect + replaceState) and must NOT be added to the actual
     file redirect, or the redirect itself 404s again (infinite loop). Bare
     paths with no "/PMS" prefix are still accepted so old links keep working. */
  var onGithubIo = location.hostname.toLowerCase().indexOf("github.io") !== -1;
  var parts = location.pathname.split("/").filter(Boolean);
  var base = "";
  if(onGithubIo){
    if(parts[0] && parts[0].toLowerCase() === "project-management-suite"){ base = "/" + parts[0]; parts = parts.slice(1); }
  } else if(parts[0] && parts[0].toLowerCase() === "pms"){
    parts = parts.slice(1);
  }
  var seg = (parts[0] || "").toLowerCase();
  var target = (seg === "thikaana_ops") ? "thikaana-ops.html" : "portal.html";
  location.replace(base + "/" + target);
</script>
</head>
<body></body>
</html>
